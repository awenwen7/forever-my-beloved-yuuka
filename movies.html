
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Our Cinema | Forever My Beloved Yuuka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #E8E7E2;
    --paper: #F8F7F2;
    --ticket: #F1F0EA;
    --ink: #292A29;
    --gray: #777873;
    --line: #D4D3CC;
    --berry: #A97878;
    --sage: #8D9A91;
    --gold: #C5A66E;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif JP", serif;
}

body.modal-open {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

.container {
    width: min(100% - 40px, 1000px);
    margin: 0 auto;
    padding: 70px 0 100px;
}

/* Hero */

.hero {
    text-align: center;
    margin-bottom: 55px;
}

.eyebrow {
    color: var(--berry);
    font-family: "Playfair Display", serif;
    font-size: 12px;
    letter-spacing: 4px;
}

.hero h1 {
    margin: 15px 0 8px;
    font-family: "Playfair Display", serif;
    font-size: clamp(38px, 7vw, 62px);
    font-weight: 500;
    letter-spacing: 5px;
}

.subtitle {
    color: var(--gray);
    font-size: 13px;
    letter-spacing: 3px;
}

.hero-line {
    width: 65px;
    height: 1px;
    background: var(--gold);
    margin: 28px auto;
}

.intro {
    color: var(--gray);
    font-size: 12px;
    letter-spacing: 1px;
}

/* Section heading */

.section-heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 45px 0 12px;
}

.section-heading::before,
.section-heading::after {
    content: "";
    height: 1px;
    background: var(--line);
    flex: 1;
}

.section-heading h2 {
    font-family: "Playfair Display", serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
    margin: 0;
}

.collection-subtitle {
    text-align: center;
    color: var(--gray);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

/* Search */

.search-wrap {
    max-width: 440px;
    margin: 0 auto 25px;
    position: relative;
}

.search-wrap input {
    width: 100%;
    padding: 14px 46px 14px 22px;
    border: 1px solid rgba(212, 211, 204, .85);
    border-radius: 30px;
    background: rgba(248, 247, 242, .78);
    color: var(--ink);
    font-family: "Noto Serif JP", serif;
    font-size: 12px;
    letter-spacing: 1px;
    outline: none;
    box-shadow: 0 3px 12px rgba(40, 38, 34, .035);
    transition: border-color .25s, background .25s, box-shadow .25s;
}

.search-wrap input:focus {
    border-color: #BDA09A;
    background: var(--paper);
    box-shadow: 0 4px 15px rgba(40, 38, 34, .07);
}

.search-wrap input::placeholder {
    color: #A6A39B;
}

.search-icon {
    position: absolute;
    right: 19px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray);
    font-size: 18px;
    pointer-events: none;
}

/* Category buttons */

.category-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 11px;
    margin-bottom: 35px;
}

.category-btn {
    min-width: 112px;
    border: 1px solid rgba(212, 211, 204, .9);
    border-radius: 30px;
    background: rgba(248, 247, 242, .38);
    color: var(--gray);
    padding: 11px 17px 10px;
    font-family: "Playfair Display", "Noto Serif JP", serif;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(40, 38, 34, .025);
    transition: background .25s, border-color .25s, color .25s, transform .25s, box-shadow .25s;
}

.category-btn:hover {
    border-color: #BDA09A;
    color: var(--berry);
    background: rgba(248, 247, 242, .8);
    transform: translateY(-2px);
}

.category-btn.active {
    background: #555653;
    border-color: #555653;
    color: #F8F7F2;
    box-shadow: 0 4px 12px rgba(40, 38, 34, .12);
}

.category-btn .jp {
    display: block;
    margin-bottom: 4px;
    font-family: "Noto Serif JP", serif;
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .95;
}

.category-btn .en {
    display: block;
    font-family: "Playfair Display", serif;
    font-size: 9px;
    letter-spacing: 1.3px;
    opacity: .8;
}

.category-btn:focus-visible {
    outline: 2px solid var(--berry);
    outline-offset: 4px;
}

/* Ticket grid */

.ticket-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
}

/* Ticket body */

.ticket {
    display: flex;
    position: relative;
    min-height: 190px;
    background: var(--ticket);
    border: 1px solid #D4D2CA;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(40, 38, 34, .08);
    cursor: pointer;
    transition: transform .25s, box-shadow .25s;
}

.ticket:focus-visible {
    outline: 2px solid var(--berry);
    outline-offset: 4px;
}

.ticket:hover {
    transform: translateY(-5px);
    box-shadow: 0 13px 25px rgba(40, 38, 34, .14);
}
    
/* Poster */

.poster {
    width: 34%;
    min-width: 100px;
    aspect-ratio: 2 / 3;
    position: relative;
    overflow: hidden;
    background: #B8B8B4;
    flex-shrink: 0;
}

.poster img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.poster-placeholder {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    color: white;
    font-family: "Playfair Display", serif;
    font-size: 20px;
    background: linear-gradient(145deg, #555653, #292A29);
}

/* Main ticket */

.ticket-main {
    flex: 1;
    padding: 17px 15px;
    min-width: 0;
}

.ticket-top {
    color: var(--gray);
    font-family: "Playfair Display", serif;
    font-size: 9px;
    letter-spacing: 2px;
}

.movie-title {
    font-size: 16px;
    font-weight: 600;
    margin: 13px 0 7px;
    line-height: 1.5;
}

.movie-meta {
    color: var(--gray);
    font-size: 10px;
    line-height: 1.9;
    white-space: pre-line;
}

.ticket-bottom {
    margin-top: 17px;
    padding-top: 9px;
    border-top: 1px dashed #C9C6BD;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
}

.ticket-date {
    color: var(--gray);
    font-size: 9px;
}

.ticket-number {
    color: var(--berry);
    font-family: "Playfair Display", serif;
    font-size: 10px;
}

/* Right ticket stub */

.ticket-stub {
    width: 74px;
    flex-shrink: 0;
    background: #555653;
    color: #F1F0EA;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 14px 5px;
    border-left: 1px dashed rgba(241, 240, 234, .8);
}

.ticket-stub::before,
.ticket-stub::after {
    content: "";
    position: absolute;
    left: -6px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bg);
    z-index: 6;
    pointer-events: none;
}

.ticket-stub::before {
    top: -6px;
}

.ticket-stub::after {
    bottom: -6px;
}

.stub-label {
    font-family: "Playfair Display", serif;
    font-size: 9px;
    letter-spacing: 1px;
    writing-mode: vertical-rl;
}

.ticket-stub .stub-label:last-child {
    transform: translateY(5px);
}

.stub-heart {
    color: #D8B8B1;
    font-size: 16px;
}

.stub-barcode {
    width: 43px;
    height: 28px;
    background: repeating-linear-gradient(
        90deg,
        #F1F0EA 0 2px,
        transparent 2px 4px,
        #F1F0EA 4px 5px,
        transparent 5px 7px
    );
}

.rotated-heart {
    display: inline-block;
    transform: rotate(90deg);
}
    
/* Stub colors */

.ticket:nth-child(2) .ticket-stub {
    background: #A97878;
}

.ticket:nth-child(3) .ticket-stub {
    background: #687B70;
}

.ticket:nth-child(4) .ticket-stub {
    background: #8B7859;
}

/* Right perforated edge */

.ticket::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 11px;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 100% 50%,
            var(--bg) 0 5px,
            transparent 5.5px
        ) right top / 11px 22px repeat-y;
}

/* Empty result */

.no-results {
    display: none;
    text-align: center;
    padding: 55px 15px;
    color: var(--gray);
    font-size: 12px;
    letter-spacing: 2px;
    line-height: 2.2;
}

.no-results.show {
    display: block;
}

.no-results span {
    display: block;
    color: var(--berry);
    font-family: "Playfair Display", serif;
    font-size: 25px;
    margin-bottom: 10px;
}

/* Footer */

.footer {
    margin-top: 65px;
    text-align: center;
    color: var(--gray);
    font-family: "Playfair Display", serif;
    font-size: 11px;
    letter-spacing: 3px;
}

.footer span {
    display: block;
    color: var(--berry);
    margin-top: 10px;
    font-family: "Noto Serif JP", serif;
    font-size: 10px;
    letter-spacing: 2px;
}

/* Movie detail modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(32, 33, 32, .65);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    position: relative;
    width: min(100%, 600px);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--paper);
    padding: 40px 36px;
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
}
/* Modal movie poster */

.modal-movie-layout {
    display: flex;
    align-items: flex-start;
    gap: 22px;
    margin-top: 22px;
}

.modal-poster-wrap {
    width: 145px;
    aspect-ratio: 2 / 3;
    flex-shrink: 0;
    overflow: hidden;
    background: #B8B8B4;
}

.modal-poster-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.modal-details {
    flex: 1;
    min-width: 0;
}

.modal-details h2 {
    margin-top: 0;
}

@media (max-width: 480px) {
    .modal-movie-layout {
        gap: 15px;
    }

    .modal-poster-wrap {
        width: 115px;
    }

    .modal-content {
        padding: 35px 20px;
    }
}
.close {
    position: absolute;
    top: 12px;
    right: 16px;
    border: none;
    background: none;
    font-size: 25px;
    color: var(--gray);
    cursor: pointer;
}

.close:focus-visible {
    outline: 2px solid var(--berry);
}

.modal-label {
    color: var(--berry);
    font-family: "Playfair Display", serif;
    font-size: 11px;
    letter-spacing: 3px;
}

.modal-content h2 {
    font-size: 24px;
    margin: 13px 0;
}

.modal-info {
    color: var(--gray);
    font-size: 12px;
    line-height: 2;
}

.modal-divider {
    height: 1px;
    background: var(--line);
    margin: 12px 0;
}

.modal-description {
    font-size: 13px;
    line-height: 2;
    white-space: pre-line;
}

/* Mobile */

@media (max-width: 650px) {
    .container {
        width: min(100% - 26px, 480px);
        padding-top: 55px;
    }

    .ticket-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .ticket {
        min-height: 175px;
    }

    .poster-placeholder {
        min-height: 175px;
    }

    .ticket-main {
        padding: 14px 12px;
    }

    .movie-title {
        font-size: 14px;
    }

    .ticket-stub {
        width: 64px;
    }

    .section-heading {
        gap: 10px;
    }

    .section-heading h2 {
        font-size: 15px;
        letter-spacing: 1px;
    }

    .category-list {
        gap: 8px;
    }

    .category-btn {
        min-width: 0;
        padding: 10px 14px;
    }
}

@media (max-width: 380px) {
    .category-btn {
        padding: 9px 11px;
    }

    .category-btn .jp {
        font-size: 10px;
    }

    .category-btn .en {
        font-size: 8px;
    }

    .poster {
        min-width: 86px;
    }

    .ticket-stub {
        width: 58px;
    }
}

/* Reduced motion */

/* Reduced motion */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}

/* Movie memory label */

.movie-memory-label {
    text-align: left;
    font-family: "Noto Serif JP", serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0;
    line-height: 2;
    margin-top: 0;
    color: var(--ink);
}
</style>
</head>

<body>

<main class="container">

    <header class="hero">
        <div class="eyebrow">WEN & YUUKA · PRIVATE CINEMA</div>
        <h1>OUR CINEMA</h1>
        <div class="subtitle">ふたりだけの映画記録。</div>
        <div class="hero-line"></div>
        <p class="intro">Every film becomes a little memory.</p>
    </header>

    <section aria-label="Our movie collection">

        <div class="section-heading">
            <h2>OUR TICKET COLLECTION</h2>
        </div>

        <div class="collection-subtitle">
            ふたりの映画を、ひとつずつ大切に。
        </div>

        <div class="search-wrap">
            <input
                type="search"
                id="movie-search"
                placeholder="映画のタイトルを検索..."
                aria-label="映画を探す"
                autocomplete="off"
            >
            <span class="search-icon" aria-hidden="true">⌕</span>
        </div>

        <div class="category-list" aria-label="Movie categories">

            <button class="category-btn active" type="button" data-category="all" aria-pressed="true">
                <span class="jp">すべて</span>
                <span class="en">ALL</span>
            </button>

            <button class="category-btn" type="button" data-category="watched" aria-pressed="false">
                <span class="jp">ふたりで観た映画</span>
                <span class="en">OUR MEMORIES</span>
            </button>

            <button class="category-btn" type="button" data-category="wishlist" aria-pressed="false">
                <span class="jp">ふたりで観たい映画</span>
                <span class="en">MOVIE WISHLIST</span>
            </button>

            <button class="category-btn" type="button" data-category="favorites" aria-pressed="false">
                <span class="jp">お気に入り</span>
                <span class="en">FAVORITES</span>
            </button>

        </div>

        <div class="ticket-grid" id="ticket-grid"></div>

        <div class="no-results" id="no-results" role="status" aria-live="polite">
            <span>♡</span>
            No movies found.
            <br>
            まだ映画がありません。
        </div>

    </section>

    <footer class="footer">
        TWO HEARTS, ONE CINEMA.
        <span>W ♡ Y</span>
    </footer>

</main>

<div class="modal" id="movie-modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">

        <button class="close" id="modal-close" type="button" aria-label="Close movie details">×</button>

       <div class="modal-label">W & Y · MOVIE ARCHIVE</div>

<div class="modal-movie-layout">
    <div class="modal-poster-wrap" id="modal-poster-wrap">
        <img id="modal-poster" alt="">
    </div>

    <div class="modal-details">
        <h2 id="modal-title"></h2>
        <div class="modal-info" id="modal-info"></div>
        <div class="modal-divider"></div>
        <div class="modal-description" id="modal-description"></div>
    </div>
</div> <!-- modal-movie-layout -->

    </div> <!-- modal-content -->
</div> <!-- modal -->

<script src="js/movies.js"></script>

<script>

"use strict";

/* Elements */

const grid = document.getElementById("ticket-grid");
const modal = document.getElementById("movie-modal");
const modalTitle = document.getElementById("modal-title");
const modalInfo = document.getElementById("modal-info");
const modalDescription = document.getElementById("modal-description");
const modalPoster = document.getElementById("modal-poster");
const modalPosterWrap = document.getElementById("modal-poster-wrap");
const modalClose = document.getElementById("modal-close");
const searchInput = document.getElementById("movie-search");
const categoryButtons = document.querySelectorAll(".category-btn");
const noResults = document.getElementById("no-results");

let activeCategory = "all";
let lastFocusedElement = null;

/* Create movie tickets */

function renderMovies() {
    grid.innerHTML = "";

    if (typeof movies === "undefined" || !Array.isArray(movies)) {
        noResults.classList.add("show");
        return;
    }

    movies.forEach((movie, index) => {
        const ticket = document.createElement("article");
        const categories = movie.category || [];

        ticket.className = "ticket";
        ticket.tabIndex = 0;
        ticket.setAttribute("role", "button");
        ticket.setAttribute("aria-label", "Open " + movie.title);

        ticket.dataset.categories = categories.join(" ");
        ticket.dataset.search = [
            movie.title,
            movie.originalTitle,
            movie.year,
            movie.director,
            movie.country,
            ...(movie.genre || [])
        ].join(" ").toLowerCase();

       const genreText = (movie.genre || []).join(" · ");

const metaText = [
    movie.originalTitle
        ? movie.originalTitle + " · " + (movie.year || "")
        : movie.year,
    [movie.country, genreText].filter(Boolean).join(" · ")
].filter(Boolean).join("\n");

const genreLabel = (movie.genre || [])[0] || "";

const dateText = categories.includes("wishlist")
    ? "MOVIE WISHLIST"
    : (movie.watchedDate || "");

        const poster = document.createElement("div");
        poster.className = "poster";

        if (movie.poster) {
            const img = document.createElement("img");
            img.src = movie.poster;
            img.alt = movie.title + " poster";

            img.onerror = () => {
                poster.innerHTML = "";
                const placeholder = document.createElement("div");
                placeholder.className = "poster-placeholder";
                placeholder.textContent = movie.title;
                poster.appendChild(placeholder);
            };

            poster.appendChild(img);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "poster-placeholder";
            placeholder.textContent = movie.title;
            poster.appendChild(placeholder);
        }

 ticket.innerHTML = `
    <div class="ticket-main">
        <div class="ticket-top">W & Y · CINEMA</div>
        <div class="movie-title"></div>
        <div class="movie-meta"></div>
        <div class="movie-genre"></div>
        <div class="ticket-bottom">
            <span class="ticket-date"></span>
            <span class="ticket-number"></span>
        </div>
    </div>

    <div class="ticket-stub">
        <span class="stub-label">ADMIT TWO</span>
        <span class="stub-heart">♡</span>
        <div class="stub-barcode"></div>
        <span class="stub-label">
        W <span class="rotated-heart">♡</span> Y
        </span>
    </div>
`;


        ticket.querySelector(".movie-title").textContent = movie.title;
        ticket.querySelector(".movie-meta").textContent = metaText;
        ticket.querySelector(".movie-genre").textContent = genreLabel;
        ticket.querySelector(".ticket-date").textContent = dateText;
        ticket.querySelector(".ticket-number").textContent =
            "No." + String(index + 1).padStart(3, "0");

        ticket.insertBefore(poster, ticket.firstChild);

        ticket.addEventListener("click", () => openMovie(movie));

        ticket.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openMovie(movie);
            }
        });

        grid.appendChild(ticket);
    });

    filterMovies();
}

function openMovie(movie) {
    lastFocusedElement = document.activeElement;

const oldMemoryDivider = modal.querySelector(".movie-memory-divider");
if (oldMemoryDivider) oldMemoryDivider.remove();

const oldMemoryLabel = modal.querySelector(".movie-memory-label");
if (oldMemoryLabel) oldMemoryLabel.remove();
    modalTitle.textContent = movie.title;

    modalInfo.textContent = movie.originalTitle
        ? movie.originalTitle + " · " + (movie.year || "")
        : (movie.year || "");

    // 顯示電影海報
    if (movie.poster) {
        modalPosterWrap.style.display = "block";
        modalPoster.src = movie.poster;
        modalPoster.alt = movie.title + " poster";
    } else {
        modalPosterWrap.style.display = "none";
        modalPoster.removeAttribute("src");
    }

    const details = [
        movie.director ? "監督：" + movie.director : "",
        movie.country ? "製作国：" + movie.country : "",
        movie.genre?.length ? "ジャンル：" + movie.genre.join(" · ") : "",
        movie.duration ? "上映時間：" + movie.duration + "分" : "",
        movie.watchedDate ? "鑑賞日：" + movie.watchedDate : ""
    ].filter(Boolean);

 modalDescription.textContent = details.join("\n") || "♡";

// 回憶區塊分隔線
const memoryDivider = document.createElement("div");
memoryDivider.className = "modal-divider movie-memory-divider";

// 回憶標題
const memoryLabel = document.createElement("div");
memoryLabel.className = "modal-label movie-memory-label";
memoryLabel.textContent = "♡ 映画の思い出 | OUR MOVIE MEMORIES";

modalDescription.insertAdjacentElement("afterend", memoryDivider);
memoryDivider.insertAdjacentElement("afterend", memoryLabel);
    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");

    modalClose.focus();
}

/* Close movie details */

function closeMovie() {
    if (!modal.classList.contains("active")) return;

    modal.classList.remove("active");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");

    if (lastFocusedElement) {
        lastFocusedElement.focus();
    }
}

/* Search and category filter */

function filterMovies() {
    const keyword = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;

    document.querySelectorAll(".ticket").forEach(ticket => {
        const categories = ticket.dataset.categories.split(" ");

        const matchesCategory =
            activeCategory === "all" ||
            categories.includes(activeCategory);

        const matchesSearch =
            ticket.dataset.search.includes(keyword);

        const shouldShow = matchesCategory && matchesSearch;

        ticket.style.display = shouldShow ? "flex" : "none";

        if (shouldShow) visibleCount++;
    });

    noResults.classList.toggle("show", visibleCount === 0);
}

/* Category buttons */

categoryButtons.forEach(button => {
    button.addEventListener("click", () => {
        categoryButtons.forEach(item => {
            item.classList.remove("active");
            item.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        activeCategory = button.dataset.category;
        filterMovies();
    });
});

/* Search input */

searchInput.addEventListener("input", filterMovies);

/* Modal close interactions */

modalClose.addEventListener("click", closeMovie);

modal.addEventListener("click", event => {
    if (event.target === modal) {
        closeMovie();
    }
});

/* Escape key */

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeMovie();
    }
});

/* Start */

renderMovies();
</script>
