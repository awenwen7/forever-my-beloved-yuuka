
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Our Places | Forever My Beloved Yuuka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* =========================================
           1. COLOR SYSTEM
        ========================================= */

        :root {
            --bg: #F5FAFD;
            --surface: #FFFFFF;
            --surface-blue: #E7F2F8;
            --surface-blue-light: #DCEEF6;
            --surface-blue-deep: #B7D8E9;

            --blue: #6D9FBC;
            --blue-hover: #5689A8;
            --blue-dark: #405E72;

            --text: #526F82;
            --muted: #819EAF;
            --border: #DCEAF2;

            --pink: #E89AAF;
            --pink-strong: #F06292;
            --pink-light: #FCECEF;

            --shadow: 0 8px 30px rgba(109, 159, 188, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Serif JP', serif;
        }

        body.modal-open {
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .places-container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 65px 0;
        }

        /* =========================================
           2. PAGE HEADER
        ========================================= */

        .page-header {
            text-align: center;
            margin-bottom: 38px;
        }

        .page-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--blue);
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--blue-dark);
            margin: 0 0 12px;
        }

        .page-description {
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1.9;
            color: var(--muted);
        }

        /* =========================================
           3. COMMON SECTION
        ========================================= */

        .section-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 500;
            color: var(--blue-dark);
        }

        .section-tag {
            padding: 7px 15px;
            background: var(--surface-blue);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--blue-hover);
            font-size: 11px;
            white-space: nowrap;
        }

        /* =========================================
           4. MAP
        ========================================= */

        .map-section {
            margin-bottom: 28px;
        }

        #japan-map {
            width: 100%;
            height: 560px;
            border-radius: 14px;
            background: var(--surface-blue-light);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1;
        }

        .leaflet-container {
            font-family: 'Noto Serif JP', serif;
            background: var(--surface-blue-light);
        }

        #japan-map .leaflet-tile {
            filter: saturate(0.78) brightness(1.06) contrast(0.94);
        }

        #japan-map .leaflet-control-zoom {
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }

        #japan-map .leaflet-control-zoom a {
            background: var(--surface);
            color: var(--blue-hover);
            border-color: var(--border);
        }

        #japan-map .leaflet-control-zoom a:hover {
            background: var(--surface-blue);
            color: var(--blue-dark);
        }

        #japan-map .leaflet-control-attribution {
            background: rgba(245, 250, 253, 0.92);
            color: var(--muted);
            font-size: 9px;
        }

        #japan-map .leaflet-control-attribution a {
            color: var(--blue-hover);
        }

        /* =========================================
           5. HEART MARKERS + DATE
        ========================================= */

        .heart-icon-wrapper {
            background: transparent;
            border: none;
        }

        .heart-marker-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 64px;
            cursor: pointer;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }

        .heart-marker-wrap:hover {
            transform: scale(1.12);
        }

        .heart-marker {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(64, 94, 114, 0.24);
        }

        .heart-marker svg {
            width: 23px;
            height: 23px;
            display: block;
        }

        .heart-marker.visited {
            color: var(--pink-strong);
        }

        .heart-marker.planned {
            color: var(--blue);
        }

        .marker-date {
            margin-top: 3px;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--blue-dark);
            font-family: Arial, sans-serif;
            font-size: 10px;
            line-height: 1.3;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(64, 94, 114, 0.12);
        }

        /* =========================================
           6. MAP POPUP
        ========================================= */

        .leaflet-popup-content-wrapper {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 13px;
            box-shadow: 0 5px 20px rgba(64, 94, 114, 0.12);
        }

        .leaflet-popup-content {
            margin: 13px 15px;
            min-width: 160px;
            color: var(--text);
        }

        .leaflet-popup-tip {
            background: #FFFFFF;
        }

        .place-popup {
            text-align: center;
        }

        .place-popup-title {
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 6px;
        }

        .place-popup-category {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 7px;
        }

        .place-popup-date {
            color: var(--pink-strong);
            font-size: 11px;
            margin-bottom: 9px;
        }

        .place-popup-button {
            display: inline-block;
            padding: 7px 13px;
            background: var(--surface-blue);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--blue-dark);
            font-size: 10px;
            cursor: pointer;
        }

        /* =========================================
           7. MAP DESCRIPTION + LEGEND
        ========================================= */

        .map-description {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
            margin: 17px 0 0;
            letter-spacing: 1px;
        }

        .map-legend {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 23px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
        }

        .legend-heart {
            font-family: Arial, sans-serif;
            font-size: 19px;
            color: var(--pink-strong);
        }

        .legend-heart.planned {
            color: var(--blue);
        }

        /* =========================================
           8. FILTER
        ========================================= */

        .map-filter {
            margin-top: 28px;
            padding: 23px 18px 19px;
            background: #F7FBFE;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .filter-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 17px;
        }

        .filter-title {
            margin: 0;
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .filter-subtitle {
            color: var(--muted);
            font-size: 10px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .filter-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 37px;
            padding: 8px 15px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: #FFFFFF;
            color: var(--text);
            font-family: 'Noto Serif JP', serif;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .filter-button:hover {
            background: var(--surface-blue);
            border-color: var(--surface-blue-deep);
            transform: translateY(-1px);
        }

        .filter-button.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #FFFFFF;
            box-shadow: 0 3px 9px rgba(109, 159, 188, 0.18);
        }

        .filter-button:focus-visible {
            outline: 2px solid var(--blue-hover);
            outline-offset: 3px;
        }

        .filter-count {
            font-family: Arial, sans-serif;
            font-size: 10px;
            opacity: 0.75;
        }

        .filter-result {
            margin: 17px 0 0;
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }

        .filter-result span {
            color: var(--blue-hover);
            font-family: Arial, sans-serif;
            font-weight: 600;
        }

        /* =========================================
           9. PLACE COLLECTION
        ========================================= */

        .places-list-section {
            margin-top: 28px;
        }

        .list-summary {
            color: var(--muted);
            font-size: 11px;
        }

        .places-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .place-card {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 14px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 15px;
            text-align: left;
            color: var(--text);
            cursor: pointer;
            transition: 0.22s ease;
        }

        .place-card:hover {
            transform: translateY(-3px);
            border-color: var(--surface-blue-deep);
            box-shadow: 0 7px 20px rgba(109, 159, 188, 0.12);
        }

        .place-card:focus-visible {
            outline: 2px solid var(--blue-hover);
            outline-offset: 3px;
        }

        .place-card-icon {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: var(--pink-light);
            color: var(--pink-strong);
            font-size: 21px;
        }

        .place-card-icon.planned {
            background: var(--surface-blue);
            color: var(--blue);
        }

        .place-card-info {
            min-width: 0;
            flex: 1;
        }

        .place-card-name {
            margin: 0 0 6px;
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .place-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.6;
        }

        .place-card-date {
            color: var(--pink-strong);
        }

        .place-card-arrow {
            color: var(--muted);
            font-size: 18px;
            flex-shrink: 0;
        }

        .empty-list {
            grid-column: 1 / -1;
            padding: 35px 15px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================================
           10. MODAL
        ========================================= */

        .place-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(47, 68, 83, 0.42);
            backdrop-filter: blur(4px);
        }

        .place-modal.open {
            display: flex;
        }

        .modal-panel {
            position: relative;
            width: min(620px, 100%);
            max-height: min(88vh, 850px);
            overflow-y: auto;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 21px;
            box-shadow: 0 20px 60px rgba(43, 70, 89, 0.2);
            animation: modalEnter 0.22s ease;
        }

        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 13px;
            right: 13px;
            z-index: 2;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(220, 234, 242, 0.9);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.94);
            color: var(--blue-dark);
            font-size: 21px;
            cursor: pointer;
        }

        .modal-photo {
            width: 100%;
            height: 240px;
            display: block;
            object-fit: cover;
            background: var(--surface-blue);
        }

        .modal-photo-placeholder {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, #E7F2F8, #FCECEF);
            color: var(--blue);
            font-size: 13px;
        }

        .modal-photo-placeholder span {
            font-size: 35px;
        }

        .modal-content {
            padding: 25px 28px 30px;
        }

        .modal-category {
            color: var(--blue);
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .modal-title {
            margin: 0 42px 12px 0;
            color: var(--blue-dark);
            font-size: 22px;
            line-height: 1.7;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .modal-status {
            display: inline-flex;
            align-items: center;
            padding: 6px 13px;
            border-radius: 20px;
            background: var(--pink-light);
            color: #D9829A;
            font-size: 11px;
        }

        .modal-status.planned {
            background: var(--surface-blue);
            color: var(--blue-hover);
        }

        .modal-section {
            margin-top: 23px;
        }

        .modal-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 12px;
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 500;
        }

        .modal-section-title::before {
            content: "";
            width: 4px;
            height: 15px;
            border-radius: 5px;
            background: var(--pink);
        }

        .visit-count {
            margin-left: auto;
            padding: 4px 9px;
            border-radius: 20px;
            background: var(--pink-light);
            color: var(--pink-strong);
            font-size: 10px;
        }

        .visit-timeline {
            display: flex;
            flex-direction: column;
            gap: 11px;
            padding-left: 8px;
        }

        .visit-record {
            position: relative;
            padding: 11px 13px;
            background: #F7FBFE;
            border: 1px solid var(--border);
            border-radius: 11px;
        }

        .visit-record-date {
            color: var(--blue-dark);
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .visit-record-note {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .visit-record-photos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
            margin-top: 10px;
        }

        .visit-record-photos img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-detail {
            padding: 13px 14px;
            background: #F7FBFE;
            border: 1px solid var(--border);
            border-radius: 11px;
            font-size: 11px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .modal-detail-row + .modal-detail-row {
            margin-top: 9px;
        }

        .modal-detail-label {
            display: block;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .modal-detail-value {
            color: var(--blue-dark);
        }

        .modal-memory {
            color: var(--text);
            font-size: 12px;
            line-height: 2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 20px;
        }

        .modal-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 39px;
            padding: 9px 15px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--surface-blue);
            color: var(--blue-dark);
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .modal-action:hover {
            background: var(--surface-blue-light);
            border-color: var(--surface-blue-deep);
        }

        .modal-empty {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.8;
        }

        /* =========================================
           11. TOAST
        ========================================= */

        .places-toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            z-index: 10001;
            transform: translate(-50%, 15px);
            opacity: 0;
            pointer-events: none;
            padding: 10px 17px;
            border-radius: 25px;
            background: var(--blue-dark);
            color: #FFFFFF;
            font-size: 11px;
            transition: 0.2s ease;
        }

        .places-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================================
           12. RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {
            .places-grid {
                grid-template-columns: 1fr;
                gap: 11px;
            }

            .section-card {
                padding: 17px;
                border-radius: 16px;
            }

            .modal-content {
                padding: 21px 19px 25px;
            }

            .modal-title {
                font-size: 19px;
            }

            .modal-photo {
                height: 195px;
            }
        }

        @media (max-width: 600px) {
            .places-container {
                width: 92%;
                padding: 42px 0;
            }

            .page-header {
                margin-bottom: 28px;
            }

            .page-title {
                font-size: 27px;
            }

            .page-description {
                font-size: 12px;
                line-height: 1.9;
            }

            #japan-map {
                height: 430px;
                border-radius: 12px;
            }

            .section-heading h2 {
                font-size: 15px;
            }

            .map-legend {
                gap: 14px;
                margin-top: 20px;
            }

            .legend-item {
                font-size: 11px;
            }

            .map-filter {
                margin-top: 23px;
                padding: 19px 12px 16px;
            }

            .filter-heading {
                flex-direction: column;
                gap: 6px;
                margin-bottom: 15px;
            }

            .filter-buttons {
                gap: 8px;
            }

            .filter-button {
                min-height: 35px;
                padding: 7px 12px;
                font-size: 10px;
            }

            .filter-result {
                font-size: 10px;
            }

            .heart-marker {
                width: 35px;
                height: 35px;
            }

            .heart-marker svg {
                width: 21px;
                height: 21px;
            }

            .marker-date {
                font-size: 9px;
                padding: 2px 5px;
            }

            .place-modal {
                padding: 12px;
            }

            .modal-panel {
                max-height: 92vh;
                border-radius: 17px;
            }

            .modal-photo-placeholder {
                height: 150px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<main class="places-container">

    <!-- PAGE HEADER -->

    <header class="page-header">
        <div class="page-label">
            OUR JOURNEY TOGETHER
        </div>

        <h1 class="page-title">
            ふたりの場所
        </h1>

        <p class="page-description">
            一緒に訪れた場所、これから訪れたい場所。
        </p>
    </header>


    <!-- MAP SECTION -->

    <section class="section-card map-section">

        <div class="section-heading">
            <h2>思い出マップ</h2>
            <span class="section-tag">日本</span>
        </div>

        <div id="japan-map"></div>

        <p class="map-description">
            地図を動かして、ふたりの足跡を探そう。
        </p>

        <div class="map-legend">

            <div class="legend-item">
                <span class="legend-heart">♥</span>
                <span>訪れた場所</span>
            </div>

            <div class="legend-item">
                <span class="legend-heart planned">♡</span>
                <span>これから行きたい場所</span>
            </div>

        </div>


        <!-- CATEGORY FILTER -->

        <div class="map-filter">

            <div class="filter-heading">
                <h3 class="filter-title">
                    地点から探す
                </h3>

                <span class="filter-subtitle">
                    カテゴリーを選択してください
                </span>
            </div>

            <div class="filter-buttons" id="filter-buttons">

                <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
                    全部 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="station" aria-pressed="false">
                    駅 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="sightseeing" aria-pressed="false">
                    観光スポット <span class="filter-count">0</span>
                </button>

    /* =========================================
       2. DOM ELEMENTS
    ========================================= */

    const mapElement = document.getElementById("japan-map");

    const modalCategory = document.getElementById("modal-category");
    const modalTitle = document.getElementById("modal-title");
    const modalStatus = document.getElementById("modal-status");
    const visitCount = document.getElementById("visit-count");
    const visitTimeline = document.getElementById("visit-timeline");

    const modalDetail = document.getElementById("modal-detail");
    const modalMemory = document.getElementById("modal-memory");

    const googleMapsLink = document.getElementById("google-maps-link");
    const copyAddressButton = document.getElementById("copy-address-button");

    const toast = document.getElementById("places-toast");

    let currentFilter = "all";
    let currentPlace = null;
    let lastFocusedElement = null;
    let toastTimer = null;


    /* =========================================
       3. SAFETY HELPERS
    ========================================= */

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }


    function formatShortDate(dateString) {
        if (!dateString) return "";

        const parts = dateString.split("-");

        if (parts.length !== 3) return dateString;

        return Number(parts[1]) + "/" + Number(parts[2]);
    }


    function formatFullDate(dateString) {
        if (!dateString) return "";

        const parts = dateString.split("-");

        if (parts.length !== 3) return dateString;

        return parts[0] + "." +
            parts[1] + "." +
            parts[2];
    }


    function getSortedVisitDates(place) {
        return [...(place.visitDates || [])]
            .filter(function (record) {
                return record && record.date;
            })
            .sort(function (a, b) {
                return a.date.localeCompare(b.date);
            });
    }


    function getLatestVisit(place) {
        const records = getSortedVisitDates(place);

        return records.length
            ? records[records.length - 1]
            : null;
    }


    function getVisitCount(place) {
        return getSortedVisitDates(place).length;
    }


    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(function () {
            toast.classList.remove("show");
        }, 2200);
    }


    /* =========================================
       4. HEART SVG
    ========================================= */

    function createHeartSVG(isVisited) {

        if (isVisited) {
            return `
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 21.2 C10.8 20.1 2.5 13.3 2.5 8.5
                        C2.5 5.4 4.7 3.3 7.4 3.3
                        C9.3 3.3 10.9 4.4 12 6
                        C13.1 4.4 14.7 3.3 16.6 3.3
                        C19.3 3.3 21.5 5.4 21.5 8.5
                        C21.5 13.3 13.2 20.1 12 21.2 Z"
                        fill="currentColor"
                        stroke="currentColor"
                        stroke-width="0.5"
                        stroke-linejoin="round"
                    />
                </svg>
            `;
        }

        return `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 21.2 C10.8 20.1 2.5 13.3 2.5 8.5
                    C2.5 5.4 4.7 3.3 7.4 3.3
                    C9.3 3.3 10.9 4.4 12 6
                    C13.1 4.4 14.7 3.3 16.6 3.3
                    C19.3 3.3 21.5 5.4 21.5 8.5
                    C21.5 13.3 13.2 20.1 12 21.2 Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        `;
    }


    /* =========================================
       5. PHOTO HANDLING

       Personal photo first.
       Fallback place photo second.
    ========================================= */

    function getMainPhoto(place) {
        return place.photo || place.fallbackPhoto || "";
    }


    function renderModalPhoto(place) {

        const photo = getMainPhoto(place);

        if (photo) {
            modalPhotoArea.innerHTML = `
                <img
                    class="modal-photo"
                    src="${escapeHTML(photo)}"
                    alt="${escapeHTML(place.name)}"
                    onerror="this.remove(); this.parentElement.innerHTML='<div class=&quot;modal-photo-placeholder&quot;><span>♡</span>ふたりの写真</div>';"
                >
            `;
        } else {
            modalPhotoArea.innerHTML = `
                <div class="modal-photo-placeholder">
                    <span>♡</span>
                    ふたりの写真
                </div>
            `;
        }
    }


    /* =========================================
       6. MAP INITIALIZATION
    ========================================= */

    if (!mapElement) {
        console.error("找不到 japan-map 地圖容器");
        return;
    }

    if (typeof L === "undefined") {
        mapElement.innerHTML =
            '<p style="padding:30px;text-align:center;color:#405E72;">地圖載入失敗，請重新整理頁面。</p>';

        console.error("Leaflet JavaScript 載入失敗");
        return;
    }

    const map = L.map("japan-map", {
        center: [34.68, 135.53],
        zoom: 11,
        minZoom: 4,
        maxZoom: 12,
        scrollWheelZoom: true,
        zoomControl: true
    });

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            subdomains: "abc",
            maxZoom: 19
        }
    ).addTo(map);


    const japanBounds = L.latLngBounds(
        [24.0, 122.0],
        [46.5, 146.0]
    );

    map.setMaxBounds(japanBounds);

    map.on("drag", function () {
        map.panInsideBounds(japanBounds, {
            animate: false
        });
    });


    /* =========================================
       7. MARKER LAYER
    ========================================= */

    const markerLayer = L.layerGroup().addTo(map);
    const markerRecords = new Map();


    function createHeartIcon(place) {

        const isVisited = place.status === "visited";
        const latestVisit = getLatestVisit(place);

        const dateLabel = isVisited && latestVisit
            ? formatShortDate(latestVisit.date)
            : "";

        const markerHTML = `
            <div class="heart-marker-wrap">

                <div class="heart-marker ${isVisited ? "visited" : "planned"}">
                    ${createHeartSVG(isVisited)}
                </div>

                ${dateLabel
                    ? `<span class="marker-date">${escapeHTML(dateLabel)}</span>`
                    : ""
                }

            </div>
        `;

        return L.divIcon({
            className: "heart-icon-wrapper",
            html: markerHTML,
            iconSize: [64, 59],
            iconAnchor: [32, 19],
            popupAnchor: [0, -18]
        });
    }


    function createMarkerPopup(place) {

        const isVisited = place.status === "visited";
        const latestVisit = getLatestVisit(place);

        const statusText = isVisited
            ? "♥ 訪れた場所"
            : "♡ これから行きたい場所";

        const dateHTML = latestVisit
            ? `<div class="place-popup-date">${escapeHTML(formatFullDate(latestVisit.date))}</div>`
            : "";

        return `
            <div class="place-popup">

                <div class="place-popup-title">
                    ${escapeHTML(place.name)}
                </div>

                <div class="place-popup-category">
                    ${escapeHTML(place.category)}
                </div>

                ${dateHTML}

                <button
                    type="button"
                    class="place-popup-button"
                    data-open-place="${escapeHTML(place.name)}"
                >
                    詳細を見る
                </button>

            </div>
        `;
    }


    places.forEach(function (place) {

        const marker = L.marker(
            [place.lat, place.lng],
            {
                icon: createHeartIcon(place)
            }
        );

        marker.bindPopup(createMarkerPopup(place));

        marker.on("popupopen", function () {
            const popupButton = document.querySelector(
                ".place-popup-button[data-open-place]"
            );

            if (popupButton) {
                popupButton.addEventListener("click", function () {
                    openPlaceModal(place);
                });
            }
        });

        markerRecords.set(place.name, {
            marker: marker,
            place: place
        });

    });


    /* =========================================
       8. PLACE LIST
    ========================================= */

    function renderPlaceList() {

        const filteredPlaces = places.filter(function (place) {
            return currentFilter === "all" ||
                place.filterCategory === currentFilter;
        });

        grid.innerHTML = "";

        if (!filteredPlaces.length) {
            grid.innerHTML = `
                <div class="empty-list">
                    このカテゴリーには、まだ場所がありません。
                </div>
            `;
        }

        filteredPlaces.forEach(function (place) {

            const isVisited = place.status === "visited";
            const latestVisit = getLatestVisit(place);
            const count = getVisitCount(place);

            const dateText = latestVisit
                ? formatShortDate(latestVisit.date)
                : "日付未登録";

            const statusText = isVisited
                ? "訪問済み"
                : "行きたい場所";

            const card = document.createElement("button");

            card.type = "button";
            card.className = "place-card";
            card.setAttribute("aria-label", place.name + " の詳細を見る");

            card.innerHTML = `
                <div class="place-card-icon ${isVisited ? "" : "planned"}">
                    ${isVisited ? "♥" : "♡"}
                </div>

                <div class="place-card-info">

                    <h3 class="place-card-name">
                        ${escapeHTML(place.name)}
                    </h3>

                    <div class="place-card-meta">

                        <span>${escapeHTML(place.category)}</span>

                        <span>${statusText}</span>

                        ${isVisited
                            ? `<span class="place-card-date">${escapeHTML(dateText)}</span>`
                            : ""
                        }

                        ${isVisited
                            ? `<span>${count} 回訪問</span>`
                            : ""
                        }

                    </div>

                </div>

                <span class="place-card-arrow">›</span>
            `;

            card.addEventListener("click", function () {

                map.flyTo(
                    [place.lat, place.lng],
                    Math.max(map.getZoom(), 15),
                    {
                        duration: 0.7
                    }
                );

                openPlaceModal(place);

            });

            grid.appendChild(card);

        });

        listSummary.textContent = filteredPlaces.length + " 件";
    }


    /* =========================================
       9. CATEGORY FILTER
    ========================================= */

    function updateFilterCounts() {

        filterButtons.forEach(function (button) {

            const category = button.dataset.filter;

            const count = category === "all"
                ? places.length
                : places.filter(function (place) {
                    return place.filterCategory === category;
                }).length;

            button.querySelector(".filter-count").textContent = count;

        });

    }


    function filterPlaces(category) {

        currentFilter = category;

        markerLayer.clearLayers();

        let visibleCount = 0;

        places.forEach(function (place) {

            const shouldShow =
                category === "all" ||
                place.filterCategory === category;

            if (shouldShow) {

                const record = markerRecords.get(place.name);

                markerLayer.addLayer(record.marker);

                visibleCount++;

            }

        });


        filterButtons.forEach(function (button) {

            const isActive = button.dataset.filter === category;

            button.classList.toggle("active", isActive);

            button.setAttribute(
                "aria-pressed",
                isActive ? "true" : "false"
            );

        });


        filterResult.innerHTML = `
            表示中：
            <span>${visibleCount} / ${places.length}</span>
            件
        `;

        renderPlaceList();
    }


    filterButtons.forEach(function (button) {

        button.addEventListener("click", function () {
            filterPlaces(button.dataset.filter);
        });

    });


    /* =========================================
       10. MODAL CONTENT
    ========================================= */

    function renderVisitTimeline(place) {

        const records = getSortedVisitDates(place);

        visitCount.textContent = records.length + " 回";

        if (!records.length) {
            visitTimeline.innerHTML = `
                <p class="modal-empty">
                    まだ訪問日が登録されていません。
                </p>
            `;
            return;
        }

        visitTimeline.innerHTML = records.map(function (record) {

            const noteHTML = record.note
                ? `<div class="visit-record-note">${escapeHTML(record.note)}</div>`
                : "";

            const photosHTML = Array.isArray(record.photos) &&
                record.photos.length
                ? `
                    <div class="visit-record-photos">
                        ${record.photos.map(function (photo) {
                            return `
                                <img
                                    src="${escapeHTML(photo)}"
                                    alt="訪問日の写真"
                                    loading="lazy"
                                >
                            `;
                        }).join("")}
                    </div>
                `
                : "";

            return `
                <article class="visit-record">

                    <div class="visit-record-date">
                        ${escapeHTML(formatFullDate(record.date))}
                    </div>

                    ${noteHTML}
                    ${photosHTML}

                </article>
            `;

        }).join("");
    }


    function renderPlaceDetails(place) {

        const addressHTML = place.address
            ? escapeHTML(place.address)
            : "住所はまだ登録されていません。";

        const hoursHTML = place.openingHours
            ? escapeHTML(place.openingHours)
            : "営業時間はまだ登録されていません。";

        modalDetail.innerHTML = `
            <div class="modal-detail-row">
                <span class="modal-detail-label">住所</span>
                <span class="modal-detail-value">${addressHTML}</span>
            </div>

            <div class="modal-detail-row">
                <span class="modal-detail-label">営業時間</span>
                <span class="modal-detail-value">${hoursHTML}</span>
            </div>
        `;

        if (place.memory) {
            modalMemory.textContent = place.memory;
        } else {
            modalMemory.textContent =
                "ここにふたりの思い出を追加できます。";
        }
    }


    /* =========================================
       11. OPEN / CLOSE MODAL
    ========================================= */

    function openPlaceModal(place) {

        currentPlace = place;
        lastFocusedElement = document.activeElement;

        const isVisited = place.status === "visited";

        modalCategory.textContent = place.category;
        modalTitle.textContent = place.name;

        modalStatus.textContent = isVisited
            ? "♥ 訪れた場所"
            : "♡ これから行きたい場所";

        modalStatus.classList.toggle("planned", !isVisited);

        renderModalPhoto(place);
        renderVisitTimeline(place);
        renderPlaceDetails(place);

        const query = encodeURIComponent(
            place.name + " Japan"
        );

        googleMapsLink.href =
            "https://www.google.com/maps/search/?api=1&query=" +
            query;

        if (place.address) {
            copyAddressButton.style.display = "inline-flex";
            copyAddressButton.disabled = false;
        } else {
            copyAddressButton.style.display = "none";
        }

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");

        document.body.classList.add("modal-open");

        modalClose.focus();
    }


    function closePlaceModal() {

        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");

        document.body.classList.remove("modal-open");

        currentPlace = null;

        if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
            lastFocusedElement.focus();
        }
    }


    modalClose.addEventListener("click", closePlaceModal);


    modal.addEventListener("click", function (event) {

        if (event.target === modal) {
            closePlaceModal();
        }

    });


    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape" && modal.classList.contains("open")) {
            closePlaceModal();
        }

    });


    /* =========================================
       12. COPY ADDRESS
    ========================================= */

    copyAddressButton.addEventListener("click", async function () {

        if (!currentPlace || !currentPlace.address) {
            return;
        }

        try {

            await navigator.clipboard.writeText(
                currentPlace.address
            );

            showToast("住所をコピーしました ♡");

        } catch (error) {

            const textarea = document.createElement("textarea");

            textarea.value = currentPlace.address;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);

            textarea.select();

            const success = document.execCommand("copy");

            textarea.remove();

            showToast(
                success
                    ? "住所をコピーしました ♡"
                    : "コピーできませんでした"
            );

        }

    });


    /* =========================================
       13. INITIALIZE
    ========================================= */

    updateFilterCounts();

    filterPlaces("all");


    const markerBounds = places.map(function (place) {
        return [place.lat, place.lng];
    });

    if (markerBounds.length > 0) {

        map.fitBounds(markerBounds, {
            padding: [45, 45],
            maxZoom: 12,
            animate: true
        });

    }


    setTimeout(function () {
        map.invalidateSize();
    }, 300);


    console.log("Places 地圖初始化成功！");
    console.log("已加入地點數量：", places.length);

});

</script>

</body>
</html>
