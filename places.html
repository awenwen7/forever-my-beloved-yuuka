
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Our Places | Forever My Beloved Yuuka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        /* =========================================
           SOFT SKY BLUE — COLOR SYSTEM
        ========================================= */

        :root {
            --bg: #F5FAFD;
            --surface: #FFFFFF;

            --surface-blue: #E7F2F8;
            --surface-blue-light: #DCEEF6;
            --surface-blue-deep: #B7D8E9;

            --blue: #6D9FBC;
            --blue-hover: #5689A8;
            --blue-dark: #405E72;

            --text: #526F82;
            --muted: #819EAF;

            --border: #DCEAF2;

            --pink: #E89AAF;
            --pink-light: #FCECEF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Serif JP', serif;
        }

        .places-container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 65px 0;
        }

        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            text-align: center;
            margin-bottom: 38px;
        }

        .page-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--blue);
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--blue-dark);
            margin: 0 0 12px;
        }

        .page-description {
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1.9;
            color: var(--muted);
        }

        /* =========================================
           MAP SECTION
        ========================================= */

        .map-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(109, 159, 188, 0.08);
        }

        .map-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .map-heading h2 {
            font-size: 17px;
            font-weight: 500;
            color: var(--blue-dark);
            margin: 0;
        }

        .map-country {
            font-size: 11px;
            color: var(--blue-hover);
            background: var(--surface-blue);
            padding: 7px 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        /* =========================================
           LEAFLET MAP
        ========================================= */

        #japan-map {
            width: 100%;
            height: 560px;
            border-radius: 14px;
            background: var(--surface-blue-light);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1;
        }

        .leaflet-container {
            font-family: 'Noto Serif JP', serif;
            background: var(--surface-blue-light);
        }

        #japan-map .leaflet-tile {
            filter:
                saturate(0.78)
                brightness(1.06)
                contrast(0.94);
        }

        /* =========================================
           HEART MARKERS
        ========================================= */

        .heart-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 42px;
            font-family: Arial, sans-serif;
            font-size: 31px;
            line-height: 1;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 2px 3px rgba(64, 94, 114, 0.2));
            cursor: pointer;
        }

        .heart-marker:hover {
            transform: scale(1.2);
        }

        /* Visited: pink solid heart */

        .heart-marker.visited {
            color: #E89AAF;
        }

        /* Planned: blue outline heart */

        .heart-marker.planned {
            color: #6D9FBC;
        }

        /* =========================================
           POPUP
        ========================================= */

        .leaflet-popup-content-wrapper {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 13px;
            box-shadow: 0 5px 20px rgba(64, 94, 114, 0.12);
        }

        .leaflet-popup-content {
            margin: 14px 17px;
            min-width: 155px;
            color: var(--text);
        }

        .leaflet-popup-tip {
            background: #FFFFFF;
        }

        .place-popup {
            text-align: center;
        }

        .place-popup-title {
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 7px;
        }

        .place-popup-category {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 8px;
        }

        .place-popup-status {
            display: inline-block;
            color: #D9829A;
            background: var(--pink-light);
            border-radius: 20px;
            padding: 5px 11px;
            font-size: 10px;
        }

        .place-popup-status.planned {
            color: var(--blue-hover);
            background: var(--surface-blue);
        }

        /* =========================================
           ZOOM CONTROLS
        ========================================= */

        #japan-map .leaflet-control-zoom {
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }

        #japan-map .leaflet-control-zoom a {
            background: var(--surface);
            color: var(--blue-hover);
            border-color: var(--border);
        }

        #japan-map .leaflet-control-zoom a:hover {
            background: var(--surface-blue);
            color: var(--blue-dark);
        }

        /* =========================================
           ATTRIBUTION
        ========================================= */

        #japan-map .leaflet-control-attribution {
            background: rgba(245, 250, 253, 0.92);
            color: var(--muted);
            font-size: 9px;
        }

        #japan-map .leaflet-control-attribution a {
            color: var(--blue-hover);
        }

        /* =========================================
           MAP DESCRIPTION
        ========================================= */

        .map-description {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
            margin: 17px 0 0;
            letter-spacing: 1px;
        }

        /* =========================================
           MAP LEGEND
        ========================================= */

        .map-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 25px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
        }

        .legend-heart {
            font-family: Arial, sans-serif;
            font-size: 19px;
            color: var(--pink);
        }

        .legend-heart.planned {
            color: var(--blue);
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .places-container {
                width: 92%;
                padding: 42px 0;
            }

            .page-header {
                margin-bottom: 28px;
            }

            .page-title {
                font-size: 27px;
            }

            .page-description {
                font-size: 12px;
                line-height: 1.9;
            }

            .map-section {
                padding: 15px;
                border-radius: 16px;
            }

            #japan-map {
                height: 430px;
                border-radius: 12px;
            }

            .map-heading h2 {
                font-size: 15px;
            }

            .map-legend {
                gap: 14px;
            }

            .legend-item {
                font-size: 11px;
            }

            .heart-marker {
                width: 34px;
                height: 38px;
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <main class="places-container">

        <header class="page-header">

            <div class="page-label">
                OUR JOURNEY TOGETHER
            </div>

            <h1 class="page-title">
                ふたりの場所
            </h1>

            <p class="page-description">
                一緒に訪れた場所、これから訪れたい場所。
            </p>

        </header>


        <section class="map-section">

            <div class="map-heading">

                <h2>思い出マップ</h2>

                <span class="map-country">
                    日本
                </span>

            </div>

            <div id="japan-map"></div>

            <p class="map-description">
                地図を動かして、ふたりの足跡を探そう。
            </p>

            <div class="map-legend">

                <div class="legend-item">
                    <span class="legend-heart">♥</span>
                    <span>訪れた場所</span>
                </div>

                <div class="legend-item">
                    <span class="legend-heart planned">♡</span>
                    <span>これから行きたい場所</span>
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         LEAFLET JAVASCRIPT
    ========================================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        const mapElement = document.getElementById("japan-map");

        if (!mapElement) {
            console.error("找不到 japan-map 地圖容器");
            return;
        }

        if (typeof L === "undefined") {

            mapElement.innerHTML =
                '<p style="padding:30px;text-align:center;color:#405E72;">地圖載入失敗，請重新整理頁面。</p>';

            console.error("Leaflet JavaScript 載入失敗");
            return;
        }


        /* =========================================
           INITIALIZE MAP
        ========================================= */

        const map = L.map("japan-map", {

            center: [34.68, 135.53],

            zoom: 11,

            minZoom: 4,

            maxZoom: 12,

            scrollWheelZoom: true,

            zoomControl: true

        });


        /* =========================================
           OPENSTREETMAP
        ========================================= */

        const tileLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',

                subdomains: "abc",

                maxZoom: 19
            }
        );

        tileLayer.addTo(map);


        /* =========================================
           JAPAN BOUNDS
        ========================================= */

        const japanBounds = L.latLngBounds(
            [24.0, 122.0],
            [46.5, 146.0]
        );

        map.setMaxBounds(japanBounds);

        map.on("drag", function () {

            map.panInsideBounds(japanBounds, {
                animate: false
            });

        });


        /* =========================================
           PLACE DATA

           status:
           visited = pink solid heart
           planned = blue outline heart

        ========================================= */

        const places = [

            /* -------------------------------------
               SHINSAIBASHI / NAMBA
            ------------------------------------- */

            {
                name: "心斎橋筋商店街",
                category: "商店街",
                lat: 34.6739,
                lng: 135.5013,
                status: "visited"
            },

            {
                name: "戎橋",
                category: "景點",
                lat: 34.6687,
                lng: 135.5013,
                status: "visited"
            },

            {
                name: "四ツ橋駅（Y14）",
                category: "車站",
                lat: 34.6756,
                lng: 135.4957,
                status: "visited"
            },

            {
                name: "Via Inn Prime Shinsaibashi-Yotsubashi",
                category: "飯店",
                lat: 34.6755,
                lng: 135.4967,
                status: "visited"
            },

            {
                name: "glänta osaka 心斎橋店",
                category: "アクセサリー・ペアリング",
                lat: 34.6705,
                lng: 135.5014,
                status: "visited"
            },

            {
                name: "irodori 文房具と雑貨のお店（大丸心斎橋店）",
                category: "文房具・雑貨",
                lat: 34.6744,
                lng: 135.5015,
                status: "visited"
            },

            {
                name: "星乃珈琲店 心斎橋ジャパンライフ店",
                category: "カフェ",
                lat: 34.6703,
                lng: 135.5025,
                status: "visited"
            },


            /* -------------------------------------
               HIGASHI-OSAKA / ISHIKIRI
            ------------------------------------- */

            {
                name: "石切参道商店街",
                category: "商店街",
                lat: 34.6810,
                lng: 135.6500,
                status: "visited"
            },

            {
                name: "石切劔箭神社",
                category: "神社",
                lat: 34.6797,
                lng: 135.6550,
                status: "visited"
            },

            {
                name: "新石切駅",
                category: "車站",
                lat: 34.6793,
                lng: 135.6404,
                status: "visited"
            },

            {
                name: "ICHIcafe",
                category: "カフェ",
                lat: 34.6818276,
                lng: 135.6451207,
                status: "visited"
            },


            /* -------------------------------------
               CENTRAL OSAKA
            ------------------------------------- */

            {
                name: "谷町四丁目駅",
                category: "車站",
                lat: 34.6814,
                lng: 135.5178,
                status: "visited"
            },

            {
                name: "セブン-イレブン 大阪内本町２丁目店",
                category: "コンビニ",
                lat: 34.6835,
                lng: 135.5150,
                status: "visited"
            }

        ];


        /* =========================================
           HEART ICON
        ========================================= */

        function createHeartIcon(status) {

            const isVisited = status === "visited";

            const heart = isVisited ? "♥" : "♡";

            const className = isVisited
                ? "heart-marker visited"
                : "heart-marker planned";

            return L.divIcon({

                className: "heart-icon-wrapper",

                html: `
                    <div class="${className}">
                        ${heart}
                    </div>
                `,

                iconSize: [38, 42],

                iconAnchor: [19, 21],

                popupAnchor: [0, -19]

            });

        }


        /* =========================================
           ADD PLACE MARKERS
        ========================================= */

        const markerBounds = [];

        places.forEach(function (place) {

            const marker = L.marker(
                [place.lat, place.lng],
                {
                    icon: createHeartIcon(place.status)
                }
            );


            /* Popup content */

            const isVisited = place.status === "visited";

            const statusText = isVisited
                ? "♥ 訪れた場所"
                : "♡ これから行きたい場所";

            const statusClass = isVisited
                ? ""
                : "planned";


            const popupContent = `
                <div class="place-popup">

                    <div class="place-popup-title">
                        ${place.name}
                    </div>

                    <div class="place-popup-category">
                        ${place.category}
                    </div>

                    <div class="place-popup-status ${statusClass}">
                        ${statusText}
                    </div>

                </div>
            `;


            marker.bindPopup(popupContent);

            marker.addTo(map);

            markerBounds.push([
                place.lat,
                place.lng
            ]);

        });


        /* =========================================
           AUTOMATIC MAP VIEW
        ========================================= */

        if (markerBounds.length > 0) {

            map.fitBounds(markerBounds, {

                padding: [35, 35],

                maxZoom: 12,

                animate: true

            });

        }


        /* =========================================
           REFRESH MAP SIZE
        ========================================= */

        setTimeout(function () {

            map.invalidateSize();

        }, 300);


        console.log("Places 地圖初始化成功！");
        console.log("已加入地點數量：", places.length);

    });

    </script>

</body>
</html>
