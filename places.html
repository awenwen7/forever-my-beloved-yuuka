
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Our Places | Forever My Beloved Yuuka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        /* =========================================
           SOFT SKY BLUE — COLOR SYSTEM
        ========================================= */

        :root {
            /* Background */
            --bg: #F5FAFD;
            --surface: #FFFFFF;

            /* Blue surfaces */
            --surface-blue: #E7F2F8;
            --surface-blue-light: #DCEEF6;
            --surface-blue-deep: #B7D8E9;

            /* Main blue */
            --blue: #6D9FBC;
            --blue-hover: #5689A8;

            /* Text */
            --blue-dark: #405E72;
            --text: #526F82;
            --muted: #819EAF;

            /* Border */
            --border: #DCEAF2;

            /* Coral pink accents */
            --pink: #E8C9C0;
            --pink-light: #F3E9E5;
        }


        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Serif JP', serif;
        }

        .places-container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 65px 0;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            text-align: center;
            margin-bottom: 38px;
        }

        .page-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--blue);
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--blue-dark);
            margin: 0 0 12px;
        }

        .page-description {
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1.9;
            color: var(--muted);
        }


        /* =========================================
           MAP SECTION
        ========================================= */

        .map-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(109, 159, 188, 0.08);
        }

        .map-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .map-heading h2 {
            font-size: 17px;
            font-weight: 500;
            color: var(--blue-dark);
            margin: 0;
        }

        .map-country {
            font-size: 11px;
            color: var(--blue-hover);
            background: var(--surface-blue);
            padding: 7px 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
        }


        /* =========================================
           LEAFLET MAP
        ========================================= */

        #japan-map {
            width: 100%;
            height: 560px;
            border-radius: 14px;
            background: var(--surface-blue-light);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1;
        }

        .leaflet-container {
            font-family: 'Noto Serif JP', serif;
            background: var(--surface-blue-light);
        }

        /* Soft blue map appearance */

        #japan-map .leaflet-tile {
            filter:
                saturate(0.78)
                brightness(1.06)
                contrast(0.94);
        }


        /* =========================================
           MAP ZOOM CONTROLS
        ========================================= */

        #japan-map .leaflet-control-zoom {
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }

        #japan-map .leaflet-control-zoom a {
            background: var(--surface);
            color: var(--blue-hover);
            border-color: var(--border);
        }

        #japan-map .leaflet-control-zoom a:hover {
            background: var(--surface-blue);
            color: var(--blue-dark);
        }


        /* =========================================
           MAP ATTRIBUTION
        ========================================= */

        #japan-map .leaflet-control-attribution {
            background: rgba(245, 250, 253, 0.92);
            color: var(--muted);
            font-size: 9px;
        }

        #japan-map .leaflet-control-attribution a {
            color: var(--blue-hover);
        }


        /* =========================================
           MAP DESCRIPTION
        ========================================= */

        .map-description {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
            margin: 17px 0 0;
            letter-spacing: 1px;
        }


        /* =========================================
           MAP LEGEND
        ========================================= */

        .map-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 25px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
        }

        /* Visited places */

        .legend-heart {
            font-size: 17px;
            color: var(--blue);
        }

        /* Future destinations */

        .legend-heart.planned {
            color: var(--pink);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .places-container {
                width: 92%;
                padding: 42px 0;
            }

            .page-header {
                margin-bottom: 28px;
            }

            .page-title {
                font-size: 27px;
            }

            .page-description {
                font-size: 12px;
                line-height: 1.9;
            }

            .map-section {
                padding: 15px;
                border-radius: 16px;
            }

            #japan-map {
                height: 430px;
                border-radius: 12px;
            }

            .map-heading h2 {
                font-size: 15px;
            }

            .map-legend {
                gap: 14px;
            }

            .legend-item {
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

    <main class="places-container">

        <header class="page-header">

            <div class="page-label">
                OUR JOURNEY TOGETHER
            </div>

            <h1 class="page-title">
                ふたりの場所
            </h1>

            <p class="page-description">
                一緒に訪れた場所、これから訪れたい場所。
            </p>

        </header>


        <section class="map-section">

            <div class="map-heading">

                <h2>思い出マップ</h2>

                <span class="map-country">
                    日本
                </span>

            </div>


            <div id="japan-map"></div>


            <p class="map-description">
                地図を動かして、ふたりの足跡を探そう。
            </p>


            <div class="map-legend">

                <div class="legend-item">
                    <span class="legend-heart">♥</span>
                    <span>訪れた場所</span>
                </div>

                <div class="legend-item">
                    <span class="legend-heart planned">♡</span>
                    <span>これから行きたい場所</span>
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         LEAFLET JAVASCRIPT
    ========================================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const mapElement = document.getElementById("japan-map");

        // Check map container
        if (!mapElement) {
            console.error("找不到 japan-map 地圖容器");
            return;
        }

        // Check Leaflet
        if (typeof L === "undefined") {

            mapElement.innerHTML =
                '<p style="padding:30px;text-align:center;color:#405E72;">地圖載入失敗，請重新整理頁面。</p>';

            console.error("Leaflet JavaScript 載入失敗");
            return;
        }


        // Initialize Japan map
        const map = L.map("japan-map", {

            center: [36.2, 138.2],

            zoom: 5,

            minZoom: 4,

            maxZoom: 12,

            scrollWheelZoom: true,

            zoomControl: true

        });


        // OpenStreetMap tiles
        const tileLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',

                subdomains: "abc",

                maxZoom: 19

            }
        );


        tileLayer.addTo(map);


        // Tile loading status
        tileLayer.on("load", function () {
            console.log("OpenStreetMap 底圖載入成功！");
        });

        tileLayer.on("tileerror", function (error) {
            console.error("地圖圖磚載入失敗：", error);
        });


        // Restrict map to Japan
        const japanBounds = L.latLngBounds(
            [24.0, 122.0],
            [46.5, 146.0]
        );

        map.setMaxBounds(japanBounds);

        map.on("drag", function () {

            map.panInsideBounds(japanBounds, {
                animate: false
            });

        });


        // Refresh map size after rendering
        setTimeout(function () {
            map.invalidateSize();
        }, 300);


        console.log("Places 地圖初始化成功！");

    });
    </script>

</body>
</html>
