
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Our Places | Forever My Beloved Yuuka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
    --bg: #F5FAFD;
    --surface: #FFFFFF;
    --surface-blue: #E7F2F8;
    --surface-blue-light: #DCEEF6;
    --surface-blue-deep: #B7D8E9;

    --blue: #6D9FBC;
    --blue-hover: #5689A8;
    --blue-dark: #405E72;

    --text: #526F82;
    --muted: #819EAF;
    --border: #DCEAF2;

    --pink: #E89AAF;
    --pink-strong: #F06292;
    --pink-light: #FCECEF;

    --shadow: 0 8px 30px rgba(109,159,188,.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
}

body.modal-open {
    overflow: hidden;
}

button, input, textarea {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.places-container {
    width: min(1100px, 92%);
    margin: 0 auto;
    padding: 65px 0;
}

/* PAGE HEADER */

.page-header {
    text-align: center;
    margin-bottom: 38px;
}

.page-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--blue);
    margin-bottom: 12px;
}

.page-title {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--blue-dark);
    margin: 0 0 12px;
}

.page-description {
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.9;
    color: var(--muted);
}

/* SECTIONS */

.section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
}

.section-heading h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    color: var(--blue-dark);
}

.section-tag {
    padding: 7px 15px;
    background: var(--surface-blue);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--blue-hover);
    font-size: 11px;
    white-space: nowrap;
}

/* MAP */

.map-section {
    margin-bottom: 28px;
}

#japan-map {
    width: 100%;
    height: 560px;
    border-radius: 14px;
    background: var(--surface-blue-light);
    border: 1px solid var(--border);
    overflow: hidden;
    z-index: 1;
}

.leaflet-container {
    font-family: 'Noto Serif JP', serif;
    background: var(--surface-blue-light);
}

#japan-map .leaflet-tile {
    filter: saturate(.78) brightness(1.06) contrast(.94);
}

#japan-map .leaflet-control-zoom {
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
}

#japan-map .leaflet-control-zoom a {
    background: var(--surface);
    color: var(--blue-hover);
    border-color: var(--border);
}

#japan-map .leaflet-control-zoom a:hover {
    background: var(--surface-blue);
    color: var(--blue-dark);
}

#japan-map .leaflet-control-attribution {
    background: rgba(245,250,253,.92);
    color: var(--muted);
    font-size: 9px;
}

#japan-map .leaflet-control-attribution a {
    color: var(--blue-hover);
}

/* HEART MARKER - NO DATE */

.heart-icon-wrapper {
    background: transparent;
    border: none;
}

.heart-marker {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    box-shadow: 0 3px 10px rgba(64,94,114,.24);
    transition: transform .2s ease, box-shadow .2s ease;
}

.heart-marker:hover {
    transform: scale(1.15);
    box-shadow: 0 5px 14px rgba(64,94,114,.28);
}

.heart-marker svg {
    width: 25px;
    height: 25px;
}

.heart-marker.visited {
    color: var(--pink-strong);
}

.heart-marker.planned {
    color: var(--blue);
}

/* POPUP */

.leaflet-popup-content-wrapper {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 5px 20px rgba(64,94,114,.12);
}

.leaflet-popup-content {
    margin: 14px 16px;
    min-width: 155px;
    color: var(--text);
}

.leaflet-popup-tip {
    background: #FFFFFF;
}

.place-popup {
    text-align: center;
}

.place-popup-title {
    color: var(--blue-dark);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 6px;
}

.place-popup-category {
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 7px;
}

.place-popup-date {
    color: var(--pink-strong);
    font-size: 11px;
    margin-bottom: 9px;
}

.place-popup-button {
    padding: 7px 13px;
    background: var(--surface-blue);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--blue-dark);
    font-size: 10px;
    cursor: pointer;
}

/* MAP DESCRIPTION + LEGEND */

.map-description {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
    margin: 17px 0 0;
    letter-spacing: 1px;
}

.map-legend {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-top: 23px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text);
}

.legend-heart {
    font-family: Arial, sans-serif;
    font-size: 19px;
    color: var(--pink-strong);
}

.legend-heart.planned {
    color: var(--blue);
}

/* FILTER */

.map-filter {
    margin-top: 28px;
    padding: 23px 18px 19px;
    background: #F7FBFE;
    border: 1px solid var(--border);
    border-radius: 15px;
}

.filter-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 17px;
}

.filter-title {
    margin: 0;
    color: var(--blue-dark);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
}

.filter-subtitle {
    color: var(--muted);
    font-size: 10px;
}

.filter-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.filter-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 37px;
    padding: 8px 15px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: #FFFFFF;
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    cursor: pointer;
    transition: .2s ease;
}

.filter-button:hover {
    background: var(--surface-blue);
    border-color: var(--surface-blue-deep);
    transform: translateY(-1px);
}

.filter-button.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #FFFFFF;
    box-shadow: 0 3px 9px rgba(109,159,188,.18);
}

.filter-button:focus-visible,
.place-card:focus-visible {
    outline: 2px solid var(--blue-hover);
    outline-offset: 3px;
}

.filter-count {
    font-family: Arial, sans-serif;
    font-size: 10px;
    opacity: .75;
}

.filter-result {
    margin: 17px 0 0;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
}

.filter-result span {
    color: var(--blue-hover);
    font-family: Arial, sans-serif;
    font-weight: 600;
}

/* PLACE LIST */

.places-list-section {
    margin-top: 28px;
}

.list-summary {
    color: var(--muted);
    font-size: 11px;
}

.places-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.place-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 15px;
    text-align: left;
    color: var(--text);
    cursor: pointer;
    transition: .22s ease;
}

.place-card:hover {
    transform: translateY(-3px);
    border-color: var(--surface-blue-deep);
    box-shadow: 0 7px 20px rgba(109,159,188,.12);
}

.place-card-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: var(--surface-blue);
    color: var(--blue);
}

.place-card-icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.place-card-info {
    min-width: 0;
    flex: 1;
}

.place-card-name {
    margin: 0 0 6px;
    color: var(--blue-dark);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.place-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
}

.place-card-date {
    color: var(--pink-strong);
}

.place-card-arrow {
    color: var(--muted);
    font-size: 18px;
    flex-shrink: 0;
}

.empty-list {
    grid-column: 1 / -1;
    padding: 35px 15px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
}

/* MODAL */

.place-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(47,68,83,.42);
    backdrop-filter: blur(4px);
}

.place-modal.open {
    display: flex;
}

.modal-panel {
    position: relative;
    width: min(620px,100%);
    max-height: min(88vh,850px);
    overflow-y: auto;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 21px;
    box-shadow: 0 20px 60px rgba(43,70,89,.2);
    animation: modalEnter .22s ease;
}

@keyframes modalEnter {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-close {
    position: absolute;
    top: 13px;
    right: 13px;
    z-index: 2;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(220,234,242,.9);
    border-radius: 50%;
    background: rgba(255,255,255,.94);
    color: var(--blue-dark);
    font-size: 21px;
    cursor: pointer;
}

.modal-photo {
    width: 100%;
    height: 240px;
    display: block;
    object-fit: cover;
    background: var(--surface-blue);
}

.modal-photo-placeholder {
    width: 100%;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: linear-gradient(135deg,#E7F2F8,#FCECEF);
    color: var(--blue);
    font-size: 13px;
}

.modal-photo-placeholder svg {
    width: 38px;
    height: 38px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.3;
}

.modal-content {
    padding: 25px 28px 30px;
}

.modal-category {
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.modal-title {
    margin: 0 42px 12px 0;
    color: var(--blue-dark);
    font-size: 22px;
    line-height: 1.7;
    font-weight: 500;
    overflow-wrap: anywhere;
}

.modal-status {
    display: inline-flex;
    align-items: center;
    padding: 6px 13px;
    border-radius: 20px;
    background: var(--pink-light);
    color: #D9829A;
    font-size: 11px;
}

.modal-status.planned {
    background: var(--surface-blue);
    color: var(--blue-hover);
}

.modal-section {
    margin-top: 23px;
}

.modal-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    color: var(--blue-dark);
    font-size: 13px;
    font-weight: 500;
}

.modal-section-title::before {
    content: "";
    width: 4px;
    height: 15px;
    border-radius: 5px;
    background: var(--pink);
}

.visit-count {
    margin-left: auto;
    padding: 4px 9px;
    border-radius: 20px;
    background: var(--pink-light);
    color: var(--pink-strong);
    font-size: 10px;
}

.visit-timeline {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.visit-record {
    padding: 12px 14px;
    background: #F7FBFE;
    border: 1px solid var(--border);
    border-radius: 11px;
}

.visit-record-date {
    color: var(--blue-dark);
    font-family: Arial,sans-serif;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
}

.visit-record-note {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.visit-record-photos {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 7px;
    margin-top: 10px;
}

.visit-record-photos img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
}

.modal-detail {
    padding: 14px;
    background: #F7FBFE;
    border: 1px solid var(--border);
    border-radius: 11px;
    font-size: 11px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.modal-detail-row + .modal-detail-row {
    margin-top: 11px;
}

.modal-detail-label {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    margin-bottom: 3px;
}

.modal-detail-label svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.modal-detail-value {
    color: var(--blue-dark);
}

.modal-memory {
    color: var(--text);
    font-size: 12px;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 20px;
}

.modal-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 39px;
    padding: 9px 15px;
    border: 1px solid var(--border);
    border-radius: 25px;
    background: var(--surface-blue);
    color: var(--blue-dark);
    font-size: 11px;
    text-decoration: none;
    cursor: pointer;
    transition: .2s ease;
}

.modal-action:hover {
    background: var(--surface-blue-light);
    border-color: var(--surface-blue-deep);
}

.modal-action svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.modal-empty {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
}

/* TOAST */

.places-toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    z-index: 10001;
    transform: translate(-50%,15px);
    opacity: 0;
    pointer-events: none;
    padding: 10px 17px;
    border-radius: 25px;
    background: var(--blue-dark);
    color: #FFFFFF;
    font-size: 11px;
    transition: .2s ease;
}

.places-toast.show {
    opacity: 1;
    transform: translate(-50%,0);
}

/* RESPONSIVE */

@media (max-width:700px) {
    .places-grid {
        grid-template-columns: 1fr;
        gap: 11px;
    }

    .section-card {
        padding: 17px;
        border-radius: 16px;
    }

    .modal-content {
        padding: 21px 19px 25px;
    }

    .modal-title {
        font-size: 19px;
    }

    .modal-photo {
        height: 195px;
    }
}

@media (max-width:600px) {
    .places-container {
        width: 92%;
        padding: 42px 0;
    }

    .page-header {
        margin-bottom: 28px;
    }

    .page-title {
        font-size: 27px;
    }

    .page-description {
        font-size: 12px;
        line-height: 1.9;
    }

    #japan-map {
        height: 430px;
        border-radius: 12px;
    }

    .section-heading h2 {
        font-size: 15px;
    }

    .map-legend {
        gap: 14px;
        margin-top: 20px;
    }

    .legend-item {
        font-size: 11px;
    }

    .map-filter {
        margin-top: 23px;
        padding: 19px 12px 16px;
    }

    .filter-heading {
        flex-direction: column;
        gap: 6px;
        margin-bottom: 15px;
    }

    .filter-buttons {
        gap: 8px;
    }

    .filter-button {
        min-height: 35px;
        padding: 7px 12px;
        font-size: 10px;
    }

    .filter-result {
        font-size: 10px;
    }

    .place-modal {
        padding: 12px;
    }

    .modal-panel {
        max-height: 92vh;
        border-radius: 17px;
    }

    .modal-photo-placeholder {
        height: 150px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,*::before,*::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="places-container">

    <header class="page-header">
        <div class="page-label">OUR JOURNEY TOGETHER</div>
        <h1 class="page-title">ふたりの場所</h1>
        <p class="page-description">
            一緒に訪れた場所、これから訪れたい場所。
        </p>
    </header>

    <!-- MAP -->

    <section class="section-card map-section">

        <div class="section-heading">
            <h2>思い出マップ</h2>
            <span class="section-tag">日本</span>
        </div>

        <div id="japan-map"></div>

        <p class="map-description">
            地図を動かして、ふたりの足跡を探そう。
        </p>

        <div class="map-legend">
            <div class="legend-item">
                <span class="legend-heart">♥</span>
                <span>訪れた場所</span>
            </div>

            <div class="legend-item">
                <span class="legend-heart planned">♡</span>
                <span>これから行きたい場所</span>
            </div>
        </div>

        <!-- FILTER -->

        <div class="map-filter">

            <div class="filter-heading">
                <h3 class="filter-title">地点から探す</h3>
                <span class="filter-subtitle">
                    カテゴリーを選択してください
                </span>
            </div>

            <div class="filter-buttons" id="filter-buttons">

                <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
                    全部 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="station" aria-pressed="false">
                    駅 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="sightseeing" aria-pressed="false">
                    観光スポット <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="restaurant" aria-pressed="false">
                    レストラン <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="cafe" aria-pressed="false">
                    カフェ <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="accommodation" aria-pressed="false">
                    宿泊 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="shopping" aria-pressed="false">
                    ショッピング <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="experience" aria-pressed="false">
                    体験 <span class="filter-count">0</span>
                </button>

                <button type="button" class="filter-button" data-filter="other" aria-pressed="false">
                    その他 <span class="filter-count">0</span>
                </button>

            </div>

            <p class="filter-result" id="filter-result">
                表示中：<span>0 / 0</span> 件
            </p>

        </div>
    </section>


    <!-- PLACE LIST -->

    <section class="section-card places-list-section">

        <div class="section-heading">
            <h2>ふたりの思い出リスト</h2>
            <span class="list-summary" id="list-summary">0 件</span>
        </div>

        <div class="places-grid" id="places-grid"></div>

    </section>

</main>


<!-- DETAIL MODAL -->

<div class="place-modal" id="place-modal"
     role="dialog" aria-modal="true"
     aria-labelledby="modal-title" aria-hidden="true">

    <div class="modal-panel">

        <button type="button" class="modal-close"
                id="modal-close" aria-label="閉じる">×</button>

        <div id="modal-photo-area"></div>

        <div class="modal-content">

    /* =========================================
       HELPERS
    ========================================= */

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    function formatShortDate(dateString) {
        if (!dateString) return "";
        const parts = dateString.split("-");
        if (parts.length !== 3) return dateString;
        return Number(parts[1]) + "/" + Number(parts[2]);
    }

    function formatFullDate(dateString) {
        if (!dateString) return "";
        const parts = dateString.split("-");
        if (parts.length !== 3) return dateString;
        return parts[0] + "." + parts[1] + "." + parts[2];
    }

    function getSortedVisitDates(place) {
        return [...(place.visitDates || [])]
            .filter(record => record && record.date)
            .sort((a, b) => a.date.localeCompare(b.date));
    }

    function getLatestVisit(place) {
        const records = getSortedVisitDates(place);
        return records.length ? records[records.length - 1] : null;
    }

    function getVisitCount(place) {
        return getSortedVisitDates(place).length;
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 2200);
    }


    /* =========================================
       HEART ICON
    ========================================= */

    function createHeartSVG(isVisited) {
        const fill = isVisited ? "currentColor" : "none";

        return `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 21.2
                    C10.8 20.1 2.5 13.3 2.5 8.5
                    C2.5 5.4 4.7 3.3 7.4 3.3
                    C9.3 3.3 10.9 4.4 12 6
                    C13.1 4.4 14.7 3.3 16.6 3.3
                    C19.3 3.3 21.5 5.4 21.5 8.5
                    C21.5 13.3 13.2 20.1 12 21.2 Z"
                    fill="${fill}"
                    stroke="currentColor"
                    stroke-width="${isVisited ? "0.5" : "2"}"
                    stroke-linejoin="round"
                />
            </svg>
        `;
    }


    /* =========================================
       PHOTO

       Personal photo first.
       Fallback place photo second.
    ========================================= */

    function getMainPhoto(place) {
        return place.photo || place.fallbackPhoto || "";
    }

    function renderModalPhoto(place) {
        const photo = getMainPhoto(place);

        if (photo) {
            const image = document.createElement("img");
            image.className = "modal-photo";
            image.alt = place.name;
            image.src = photo;

            image.onerror = function () {
                modalPhotoArea.innerHTML = `
                    <div class="modal-photo-placeholder">
                        ${icons.sightseeing}
                        ふたりの写真
                    </div>
                `;
            };

            modalPhotoArea.replaceChildren(image);
        } else {
            modalPhotoArea.innerHTML = `
                <div class="modal-photo-placeholder">
                    ${icons.sightseeing}
                    ふたりの写真
                </div>
            `;
        }
    }


    /* =========================================
       MAP INITIALIZATION
    ========================================= */

    if (!mapElement) {
        console.error("找不到 japan-map 地圖容器");
        return;
    }

    if (typeof L === "undefined") {
        mapElement.textContent = "地圖載入失敗，請重新整理頁面。";
        return;
    }

    const map = L.map("japan-map", {
        center: [34.68, 135.53],
        zoom: 11,
        minZoom: 4,
        maxZoom: 12,
        scrollWheelZoom: true,
        zoomControl: true
    });

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            subdomains: "abc",
            maxZoom: 19
        }
    ).addTo(map);

    const japanBounds = L.latLngBounds(
        [24.0, 122.0],
        [46.5, 146.0]
    );

    map.setMaxBounds(japanBounds);

    map.on("drag", function () {
        map.panInsideBounds(japanBounds, { animate: false });
    });


    /* =========================================
       MARKERS
    ========================================= */

    const markerLayer = L.layerGroup().addTo(map);
    const markerRecords = new Map();

    function createHeartIcon(place) {
        const isVisited = place.status === "visited";

        return L.divIcon({
            className: "heart-icon-wrapper",
            html: `
                <div class="heart-marker ${isVisited ? "visited" : "planned"}">
                    ${createHeartSVG(isVisited)}
                </div>
            `,
            iconSize: [42, 42],
            iconAnchor: [21, 21],
            popupAnchor: [0, -22]
        });
    }

    function createMarkerPopup(place) {
        const isVisited = place.status === "visited";
        const latestVisit = getLatestVisit(place);

        return `
            <div class="place-popup">
                <div class="place-popup-title">
                    ${escapeHTML(place.name)}
                </div>

                <div class="place-popup-category">
                    ${escapeHTML(place.category)}
                </div>

                ${latestVisit ? `
                    <div class="place-popup-date">
                        ♥ ${escapeHTML(formatFullDate(latestVisit.date))}
                    </div>
                ` : ""}

                <button type="button"
                        class="place-popup-button"
                        data-open-place="${escapeHTML(place.name)}">
                    詳細を見る
                </button>
            </div>
        `;
    }

    places.forEach(function (place) {
        const marker = L.marker(
            [place.lat, place.lng],
            { icon: createHeartIcon(place) }
        );

        marker.bindPopup(createMarkerPopup(place));

        marker.on("popupopen", function (event) {
            const popupElement = event.popup.getElement();
            const button = popupElement?.querySelector("[data-open-place]");

            if (button) {
                button.addEventListener("click", function () {
                    openPlaceModal(place);
                });
            }
        });

        markerRecords.set(place.name, {
            marker: marker,
            place: place
        });
    });


    /* =========================================
       PLACE LIST
    ========================================= */

    function renderPlaceList() {
        const filteredPlaces = places.filter(function (place) {
            return currentFilter === "all" ||
                place.filterCategory === currentFilter;
        });

        grid.innerHTML = "";

        if (!filteredPlaces.length) {
            grid.innerHTML = `
                <div class="empty-list">
                    このカテゴリーには、まだ場所がありません。
                </div>
            `;
        }

        filteredPlaces.forEach(function (place) {
            const isVisited = place.status === "visited";
            const latestVisit = getLatestVisit(place);
            const count = getVisitCount(place);

            const dateText = latestVisit
                ? formatShortDate(latestVisit.date)
                : "日付未登録";

            const card = document.createElement("button");
            card.type = "button";
            card.className = "place-card";

            const icon = icons[place.filterCategory] || icons.other;

            card.innerHTML = `
                <div class="place-card-icon">
                    ${icon}
                </div>

                <div class="place-card-info">
                    <h3 class="place-card-name">
                        ${escapeHTML(place.name)}
                    </h3>

                    <div class="place-card-meta">
                        <span>${escapeHTML(place.category)}</span>
                        <span>${isVisited ? "訪問済み" : "行きたい場所"}</span>

                        ${isVisited ? `
                            <span class="place-card-date">
                                ${escapeHTML(dateText)}
                            </span>
                            <span>${count} 回訪問</span>
                        ` : ""}
                    </div>
                </div>

                <span class="place-card-arrow">›</span>
            `;

            card.addEventListener("click", function () {
                map.flyTo(
                    [place.lat, place.lng],
                    Math.max(map.getZoom(), 15),
                    { duration: .7 }
                );

                openPlaceModal(place);
            });

            grid.appendChild(card);
        });

        listSummary.textContent = filteredPlaces.length + " 件";
    }


    /* =========================================
       CATEGORY FILTER
    ========================================= */

    function updateFilterCounts() {
        filterButtons.forEach(function (button) {
            const category = button.dataset.filter;

            const count = category === "all"
                ? places.length
                : places.filter(place =>
                    place.filterCategory === category
                ).length;

            button.querySelector(".filter-count").textContent = count;
        });
    }

    function filterPlaces(category) {
        currentFilter = category;
        markerLayer.clearLayers();

        let visibleCount = 0;

        places.forEach(function (place) {
            const shouldShow =
                category === "all" ||
                place.filterCategory === category;

            if (shouldShow) {
                markerLayer.addLayer(
                    markerRecords.get(place.name).marker
                );
                visibleCount++;
            }
        });

        filterButtons.forEach(function (button) {
            const active = button.dataset.filter === category;

            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
        });

        filterResult.innerHTML = `
            表示中：
            <span>${visibleCount} / ${places.length}</span>
            件
        `;

        renderPlaceList();
    }

    filterButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            filterPlaces(button.dataset.filter);
        });
    });


    /* =========================================
       VISIT HISTORY
    ========================================= */

    function renderVisitTimeline(place) {
        const records = getSortedVisitDates(place);

        visitCount.textContent = records.length + " 回";

        if (!records.length) {
            visitTimeline.innerHTML = `
                <p class="modal-empty">
                    まだ訪問日が登録されていません。
                </p>
            `;
            return;
        }

        visitTimeline.innerHTML = records.map(function (record) {
            const noteHTML = record.note
                ? `<div class="visit-record-note">${escapeHTML(record.note)}</div>`
                : "";

            const photosHTML = Array.isArray(record.photos) &&
                record.photos.length
                ? `
                    <div class="visit-record-photos">
                        ${record.photos.map(function (photo) {
                            return `
                                <img src="${escapeHTML(photo)}"
                                     alt="訪問日の写真"
                                     loading="lazy">
                            `;
                        }).join("")}
                    </div>
                `
                : "";

            return `
                <article class="visit-record">
                    <div class="visit-record-date">
                        ${escapeHTML(formatFullDate(record.date))}
                    </div>
                    ${noteHTML}
                    ${photosHTML}
                </article>
            `;
        }).join("");
    }


    /* =========================================
       PLACE DETAILS
    ========================================= */

    function renderPlaceDetails(place) {
        modalDetail.innerHTML = `
            <div class="modal-detail-row">
                <span class="modal-detail-label">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>
                    住所
                </span>
                <span class="modal-detail-value">
                    ${escapeHTML(place.address || "住所は未登録です。")}
                </span>
            </div>

            <div class="modal-detail-row">
                <span class="modal-detail-label">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                    営業時間
                </span>
                <span class="modal-detail-value">
                    ${escapeHTML(place.openingHours || "営業時間は未登録です。")}
                </span>
            </div>
        `;

        modalMemory.textContent = place.memory ||
            "ここにふたりの思い出を追加できます。";
    }


    /* =========================================
       MODAL
    ========================================= */

    function openPlaceModal(place) {
        currentPlace = place;
        lastFocusedElement = document.activeElement;

        const isVisited = place.status === "visited";

        modalCategory.textContent = place.category;
        modalTitle.textContent = place.name;

        modalStatus.textContent = isVisited
            ? "♥ 訪れた場所"
            : "♡ これから行きたい場所";

        modalStatus.classList.toggle("planned", !isVisited);

        renderModalPhoto(place);
        renderVisitTimeline(place);
        renderPlaceDetails(place);

        const query = encodeURIComponent(
            place.address
                ? place.name + " " + place.address
                : place.name + " Japan"
        );

        googleMapsLink.href =
            "https://www.google.com/maps/search/?api=1&query=" + query;

        copyAddressButton.style.display = place.address
            ? "inline-flex"
            : "none";

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");

        modalClose.focus();
    }

    function closePlaceModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("modal-open");

        currentPlace = null;

        if (lastFocusedElement &&
            typeof lastFocusedElement.focus === "function") {
            lastFocusedElement.focus();
        }
    }

    modalClose.addEventListener("click", closePlaceModal);

    modal.addEventListener("click", function (event) {
        if (event.target === modal) {
            closePlaceModal();
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && modal.classList.contains("open")) {
            closePlaceModal();
        }
    });


    /* =========================================
       COPY ADDRESS
    ========================================= */

    copyAddressButton.addEventListener("click", async function () {
        if (!currentPlace || !currentPlace.address) return;

        try {
            await navigator.clipboard.writeText(currentPlace.address);
            showToast("住所をコピーしました ♡");
        } catch (error) {
            const textarea = document.createElement("textarea");

            textarea.value = currentPlace.address;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);
            textarea.select();

            const success = document.execCommand("copy");
            textarea.remove();

            showToast(success
                ? "住所をコピーしました ♡"
                : "コピーできませんでした"
            );
        }
    });


    /* =========================================
       INITIALIZE
    ========================================= */

    updateFilterCounts();
    filterPlaces("all");

    const markerBounds = places.map(place => [
        place.lat,
        place.lng
    ]);

    if (markerBounds.length) {
        map.fitBounds(markerBounds, {
            padding: [45, 45],
            maxZoom: 12,
            animate: true
        });
    }

    setTimeout(function () {
        map.invalidateSize();
    }, 300);

    console.log("Places 地圖初始化成功！");
    console.log("已加入地點數量：", places.length);

});
</script>

</body>
</html>
