
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Our Games | Forever My Beloved Yuuka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/games.css">
</head>

<body>

<main class="games-page">

    <!-- HERO -->
    <section class="games-hero">

        <p class="eyebrow">OUR GAME COLLECTION</p>

        <h1>Games</h1>

        <p class="hero-description">
            Every game holds a little memory of us.
        </p>

        <div class="hero-divider">
            <span>♡</span>
        </div>

    </section>


    <!-- GAME COLLECTION -->
    <section class="game-collection">

        <div class="collection-heading">
            <p class="section-label">OUR LITTLE WORLD</p>

            <h2>Game Collection</h2>

            <p>Our adventures, kept together.</p>
        </div>


        <!-- CARTRIDGE SHELF -->
        <div class="cartridge-shelf" id="cartridgeShelf">


            <!-- SPLATOON 3 -->
            <button
                class="game-cartridge"
                type="button"
                data-title="Splatoon 3"
                data-cover="images/games/splatoon-3.jpg"
                data-page="games/splatoon.html"
                aria-label="Open Splatoon 3 memories"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/splatoon-3.jpg"
                            alt="Splatoon 3"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    Splatoon 3
                </span>

            </button>


            <!-- SKY -->
            <button
                class="game-cartridge"
                type="button"
                data-title="Sky: Children of the Light"
                data-cover="images/games/sky.jpg"
                data-page="games/sky.html"
                aria-label="Open Sky memories"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/sky.jpg"
                            alt="Sky: Children of the Light"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    Sky
                </span>

            </button>


            <!-- ANIMAL CROSSING -->
            <button
                class="game-cartridge"
                type="button"
                data-title="Animal Crossing"
                data-cover="images/games/animal-crossing.jpg"
                data-page="games/animal-crossing.html"
                aria-label="Open Animal Crossing memories"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/animal-crossing.jpg"
                            alt="Animal Crossing"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    Animal Crossing
                </span>

            </button>


        </div>

    </section>


    <!-- LAUNCH SCREEN -->
    <section
        class="launch-screen"
        id="launchScreen"
        aria-hidden="true"
        inert
    >

        <button
            class="launch-close"
            id="closeLaunch"
            type="button"
            aria-label="Close"
        >
            ×
        </button>


        <div class="launch-content">

            <!-- ENLARGED CARTRIDGE -->
            <div class="launch-cartridge" id="launchCartridge">

                <div class="launch-cartridge-top">
                    <span class="launch-cartridge-notch"></span>
                </div>

                <div class="launch-cartridge-label">

                    <img
                        id="launchCover"
                        src=""
                        alt=""
                    >

                </div>

                <div class="launch-cartridge-bottom"></div>

            </div>


            <div class="launch-title" id="launchTitle"></div>


            <!-- OPEN MEMORY PAGE -->
            <button
                class="open-memory-button"
                id="openMemoryButton"
                type="button"
            >
                Open Memories
                <span>♡</span>
            </button>

        </div>

    </section>

</main>


<script src="js/games.js"></script>

</body>
</html>
