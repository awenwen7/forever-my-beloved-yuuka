<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Our Games | Forever My Beloved Yuuka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/games.css">
</head>

<body>

<main class="games-page">

    <!-- HERO -->
    <section class="games-hero">

        <div class="games-hero-image">
            <img
                src="images/games-cover.jpg"
                alt="Our Gaming Memories"
            >

            <div class="games-hero-overlay"></div>

            <div class="games-hero-content">

                <p class="eyebrow">
                    ふたりで遊んだ時間も、大切な思い出。
                </p>

                <h1>Games</h1>

                <p class="hero-description">
                    Every game holds a little memory of us.
                </p>

            </div>

        </div>

        <div class="hero-divider">
            <span>♡</span>
        </div>

    </section>

    <!-- GAME COLLECTION -->
    <section class="game-collection">

        <div class="collection-heading">

            <p class="section-label">OUR LITTLE WORLD</p>

            <h2>Game Collection</h2>

            <p>ふたりの冒険を、ひとつずつ大切に。</p>

        </div>


        <!-- CARTRIDGE SHELF -->
        <div class="cartridge-shelf" id="cartridgeShelf">

            <!-- 01 SPLATOON  -->
            <button
                class="game-cartridge"
                type="button"
                data-title="スプラトゥーン"
                data-cover="images/games/splatoon3.jpg"
                data-page="splatoon.html"
                aria-label="スプラトゥーンの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/splatoon3.jpg"
                            alt="スプラトゥーン"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    スプラトゥーン
                </span>

            </button>


            <!-- 02 SPLATOON RAIDERS -->
            <button
                class="game-cartridge"
                type="button"
                data-title="スプラトゥーン レイダース"
                data-cover="images/games/splatoon-raiders.jpg"
                data-page="games/splatoon-raiders.html"
                aria-label="スプラトゥーン レイダースの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/splatoon-raiders.jpg"
                            alt="スプラトゥーン レイダース"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    スプラトゥーン レイダース
                </span>

            </button>


            <!-- 03 SKY -->
            <button
                class="game-cartridge"
                type="button"
                data-title="Sky 星を紡ぐ子どもたち"
                data-cover="images/games/sky.jpg"
                data-page="games/sky.html"
                aria-label="Sky 星を紡ぐ子どもたちの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/sky.jpg"
                            alt="Sky 星を紡ぐ子どもたち"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    Sky 星を紡ぐ子どもたち
                </span>

            </button>

            <!-- 04 ANIMAL CROSSING -->
            <button
                class="game-cartridge"
                type="button"
                data-title="あつまれ どうぶつの森"
                data-cover="images/games/animal-crossing.jpg"
                data-page="games/animal-crossing.html"
                aria-label="あつまれ どうぶつの森の思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/animal-crossing.jpg"
                            alt="あつまれ どうぶつの森"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    あつまれ どうぶつの森
                </span>

            </button>

            <!-- 05 TOMODACHI COLLECTION -->
            <button
                class="game-cartridge"
                type="button"
                data-title="トモダチコレクション"
                data-cover="images/games/tomodachi-collection.jpg"
                data-page="games/tomodachi-collection.html"
                aria-label="トモダチコレクションの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/tomodachi-collection.jpg"
                            alt="トモダチコレクション"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    トモダチコレクション
                </span>

            </button>

            <!-- 06 LITTLE NIGHTMARES -->
            <button
                class="game-cartridge"
                type="button"
                data-title="Little Nightmares"
                data-cover="images/games/little-nightmares.jpg"
                data-page="games/little-nightmares.html"
                aria-label="Little Nightmaresの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/little-nightmares.jpg"
                            alt="Little Nightmares "
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    Little Nightmares 
                </span>

            </button>


            <!-- 07 REANIMAL -->
            <button
                class="game-cartridge"
                type="button"
                data-title="REANIMAL"
                data-cover="images/games/reanimal.jpg"
                data-page="games/re-shaping-life.html"
                aria-label="REANIMALの思い出を開く"
            >

                <span class="cartridge-shell">

                    <span class="cartridge-top">
                        <span class="cartridge-notch"></span>
                    </span>

                    <span class="cartridge-label">
                        <img
                            src="images/games/reanimal.jpg"
                            alt="REANIMAL"
                            loading="lazy"
                        >
                    </span>

                    <span class="cartridge-bottom">
                        <span class="cartridge-contact"></span>
                    </span>

                </span>

                <span class="cartridge-name">
                    REANIMAL
                </span>

            </button>


           <!-- 08 その他 -->
<button
    class="game-cartridge"
    type="button"
    data-title="その他"
    data-cover="images/games/bokura.jpg"
    data-page="games/other.html"
    aria-label="その他の思い出を開く"
>

    <span class="cartridge-shell">

        <span class="cartridge-top">
            <span class="cartridge-notch"></span>
        </span>

        <span class="cartridge-label">
            <img
                src="images/games/bokura.jpg"
                alt="その他"
                loading="lazy"
            >
        </span>

        <span class="cartridge-bottom">
            <span class="cartridge-contact"></span>
        </span>

    </span>

    <span class="cartridge-name">
        その他
    </span>

</button>
    </section>


    <!-- LAUNCH SCREEN -->
    <section
        class="launch-screen"
        id="launchScreen"
        aria-hidden="true"
        inert
    >

        <button
            class="launch-close"
            id="closeLaunch"
            type="button"
            aria-label="閉じる"
        >
            ×
        </button>


        <div class="launch-content">

            <!-- ENLARGED CARTRIDGE -->
            <div class="launch-cartridge" id="launchCartridge">

                <div class="launch-cartridge-top">
                    <span class="launch-cartridge-notch"></span>
                </div>

                <div class="launch-cartridge-label">

                    <img
                        id="launchCover"
                        src=""
                        alt=""
                    >

                </div>

                <div class="launch-cartridge-bottom"></div>

            </div>


            <div class="launch-title" id="launchTitle"></div>


            <!-- OPEN MEMORY PAGE -->
            <button
                class="open-memory-button"
                id="openMemoryButton"
                type="button"
            >
                思い出を見る
                <span>♡</span>
            </button>

        </div>

    </section>

</main>


<script src="js/games.js"></script>

</body>
</html>
