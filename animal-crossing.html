<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>ふたりの島 | Animal Crossing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/animal-crossing.css">
</head>

<body class="ac-body">

    <!-- TOP NAVIGATION -->
    <header class="ac-header">

        <a href="games.html" class="ac-back" aria-label="ゲーム一覧へ戻る">
            <span>‹</span>
            <span>GAMES</span>
        </a>

        <div class="ac-island-name">
            <span class="ac-leaf">🍃</span>
            <span>ふたりの島</span>
        </div>

        <div class="ac-header-right">
            <span class="ac-header-caption">OUR ISLAND</span>
        </div>

    </header>


    <main class="ac-main">

        <!-- ISLAND INTRODUCTION -->
        <section class="ac-intro">

            <div class="ac-intro-decoration ac-decoration-left">✿</div>
            <div class="ac-intro-decoration ac-decoration-right">✿</div>

            <p class="ac-intro-eyebrow">
                WELCOME TO OUR ISLAND
            </p>

            <h1>ふたりの島</h1>

            <p class="ac-intro-description">
                ふたりで過ごす、のんびりとした島の暮らし。
            </p>

            <div class="ac-intro-divider">
                <span></span>
                <span>♡</span>
                <span></span>
            </div>

        </section>


        <!-- CATEGORY PANEL -->
        <section class="ac-panel">

            <div class="ac-panel-heading">

                <div>
                    <p class="ac-panel-eyebrow">ISLAND MENU</p>
                    <h2>島のメニュー</h2>
                </div>

                <span class="ac-panel-leaf">🍃</span>

            </div>


            <!-- PAGE 01 -->
            <div class="ac-menu-page active" data-menu-page="1">

                <div class="ac-menu-grid">

                    <!-- PASSPORT -->
                    <button class="ac-menu-button" data-section="passport">
                        <span class="ac-icon-tile tile-peach">
                            <img src="images/animal-crossing/icons/passport.png" alt="">
                        </span>
                        <span class="ac-button-title">パスポート</span>
                        <span class="ac-button-subtitle">PASSPORT</span>
                    </button>


                    <!-- MUSIC -->
                    <button class="ac-menu-button" data-section="music">
                        <span class="ac-icon-tile tile-lavender">
                            <img src="images/animal-crossing/icons/music.png" alt="">
                        </span>
                        <span class="ac-button-title">ミュージック</span>
                        <span class="ac-button-subtitle">MUSIC</span>
                    </button>


                    <!-- PHOTO ALBUM -->
                    <button class="ac-menu-button" data-section="photos">
                        <span class="ac-icon-tile tile-pink">
                            <img src="images/animal-crossing/icons/photos.png" alt="">
                        </span>
                        <span class="ac-button-title">島の写真</span>
                        <span class="ac-button-subtitle">PHOTO ALBUM</span>
                    </button>


                    <!-- DREAM ISLAND -->
                    <button class="ac-menu-button" data-section="dream">
                        <span class="ac-icon-tile tile-blue">
                            <img src="images/animal-crossing/icons/dream.png" alt="">
                        </span>
                        <span class="ac-button-title">夢の島</span>
                        <span class="ac-button-subtitle">DREAM ISLAND</span>
                    </button>


                    <!-- ISLAND DESIGN -->
                    <button class="ac-menu-button" data-section="design">
                        <span class="ac-icon-tile tile-green">
                            <img src="images/animal-crossing/icons/design.png" alt="">
                        </span>
                        <span class="ac-button-title">島づくり</span>
                        <span class="ac-button-subtitle">ISLAND DESIGN</span>
                    </button>


                    <!-- OUR HOME -->
                    <button class="ac-menu-button" data-section="home">
                        <span class="ac-icon-tile tile-yellow">
                            <img src="images/animal-crossing/icons/home.png" alt="">
                        </span>
                        <span class="ac-button-title">おうち</span>
                        <span class="ac-button-subtitle">OUR HOME</span>
                    </button>


                    <!-- ISLAND BULLETIN -->
                    <button class="ac-menu-button" data-section="bulletin">
                        <span class="ac-icon-tile tile-orange">
                            <img src="images/animal-crossing/icons/bulletin.png" alt="">
                        </span>
                        <span class="ac-button-title">島のおしらせ</span>
                        <span class="ac-button-subtitle">BULLETIN</span>
                    </button>


                    <!-- EVENTS -->
                    <button class="ac-menu-button" data-section="events">
                        <span class="ac-icon-tile tile-mint">
                            <img src="images/animal-crossing/icons/events.png" alt="">
                        </span>
                        <span class="ac-button-title">イベント</span>
                        <span class="ac-button-subtitle">EVENTS</span>
                    </button>


                    <!-- OUR MEMORIES -->
                    <button class="ac-menu-button" data-section="memories">
                        <span class="ac-icon-tile tile-purple">
                            <img src="images/animal-crossing/icons/memories.png" alt="">
                        </span>
                        <span class="ac-button-title">ふたりの記録</span>
                        <span class="ac-button-subtitle">OUR MEMORIES</span>
                    </button>

                </div>

            </div>


            <div class="ac-panel-footer">
                <span>ふたりだけの小さな島</span>
                <span>♡</span>
                <span>PAGE 01</span>
            </div>

        </section>


        <!-- ISLAND FOOTER -->
        <footer class="ac-footer">
            <p>Made with love, just for us.</p>
            <span>WEN & YUUKA ♡</span>
        </footer>

    </main>


    <!-- CATEGORY MODAL -->
    <div class="ac-modal" id="acModal" aria-hidden="true">

        <div class="ac-modal-backdrop" data-close-modal></div>

        <section
            class="ac-modal-window"
            role="dialog"
            aria-modal="true"
            aria-labelledby="acModalTitle"
        >

            <button
                class="ac-modal-close"
                id="acModalClose"
                type="button"
                aria-label="閉じる"
            >
                ×
            </button>

            <div class="ac-modal-heading">
                <p id="acModalEnglish"></p>
                <h2 id="acModalTitle"></h2>
                <span>♡</span>
            </div>

            <div class="ac-modal-content" id="acModalContent"></div>

        </section>

    </div>


    <script src="js/animal-crossing.js"></script>

</body>
</html>
