
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Music Library | Forever My Beloved Yuuka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #FBF8F3;
    color: #806B5A;
    font-family: "Noto Serif JP", serif;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* 導覽列 */

.site-header {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: calc(100% - 30px);
    max-width: 680px;
    height: 46px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 9px;
    background: #806B5A;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 3px 10px rgba(80, 60, 45, 0.12);
}

.nav-button {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #FFF9F0;
    cursor: pointer;
}

.nav-button svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.7;
}

.nav-title {
    color: #FFF9F0;
    font-size: 15px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    text-align: center;
}

.language-button {
    justify-self: end;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #FFF9F0;
    cursor: pointer;
}

.language-button svg {
    width: 20px;
    height: 20px;
}

.container {
    padding: 66px 18px 60px;
    max-width: 680px;
    margin: 0 auto;
}

/* 語言選單 */

.language-menu {
    position: fixed;
    top: 56px;
    right: max(24px, calc((100vw - 680px) / 2 + 9px));
    z-index: 1001;
    width: 145px;
    padding: 7px;
    background: #FFF9F0;
    border: 1px solid #E8DED3;
    border-radius: 10px;
    box-shadow: 0 5px 18px rgba(80, 60, 45, 0.15);
}

.language-menu[hidden] {
    display: none;
}

.language-option {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 10px;
    border: none;
    background: transparent;
    color: #806B5A;
    font-size: 13px;
    text-align: left;
}

.language-option + .language-option {
    border-top: 1px solid #E9DED3;
}

.language-check {
    font-size: 15px;
    font-weight: bold;
}

.language-option.active .language-check::before {
    content: "✓";
}

/* 漢堡選單 */

.menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 30, 24, 0.35);
    z-index: 1090;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.menu-overlay.active {
    opacity: 1;
    visibility: visible;
}

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: min(290px, 82vw);
    height: 100dvh;
    padding: 35px 25px;
    background: #806B5A;
    color: #FFF9F0;
    z-index: 1100;
    transform: translateX(-100%);
    transition: transform 0.35s ease;
    overflow-y: auto;
}

.side-menu.active {
    transform: translateX(0);
}

.menu-close {
    position: absolute;
    top: 13px;
    right: 17px;
    border: none;
    background: none;
    color: #FFF9F0;
    font-size: 29px;
    font-weight: 300;
}

.menu-heading {
    font-size: 16px;
    letter-spacing: 1px;
    margin: 25px 0 35px;
    text-align: center;
}

.menu-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #D8C9BB;
    margin-bottom: 20px;
}

/* Music Library */

.page-heading {
    text-align: center;
    margin: 20px 0 30px;
}

.page-heading h1 {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 2px;
    margin: 0 0 8px;
}

.page-heading p {
    font-size: 11px;
    color: #A18D7B;
    letter-spacing: 1px;
    margin: 0;
}

/* 播放器 */

.player-card {
    background: #F3E8E1;
    border: 1px solid #E5DED6;
    border-radius: 15px;
    padding: 25px 22px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(80, 60, 45, 0.04);
}

.now-playing {
    font-size: 10px;
    letter-spacing: 3px;
    color: #A18D7B;
    margin-bottom: 20px;
}

.album-cover {
    width: min(100%, 260px);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 9px;
    background: #E5DED6;
    box-shadow: 0 5px 16px rgba(80, 60, 45, 0.12);
}

.track-title {
    font-size: 20px;
    font-weight: 500;
    margin: 20px 0 5px;
}

.track-artist {
    font-size: 12px;
    color: #A18D7B;
    margin: 0 0 22px;
}

/* 播放進度 */

.progress-area {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    color: #A18D7B;
}

.progress-area input {
    flex: 1;
    min-width: 0;
    accent-color: #A9877D;
    cursor: pointer;
}

input[type="range"] {
    accent-color: #A9877D;
}

.volume-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
    font-size: 12px;
    color: #A18D7B;
}

.volume-area input {
    width: 100px;
}

/* 播放按鈕 */

.player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 23px 0 18px;
}

.control-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    color: #806B5A;
    font-size: 19px;
    border-radius: 50%;
}

.control-button.active {
    color: #B58D86;
    background: rgba(181, 141, 134, 0.13);
}

.play-button {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: #806B5A;
    color: #FFF9F0;
    font-size: 21px;
    box-shadow: 0 3px 9px rgba(80, 60, 45, 0.15);
}

.mode-label {
    font-size: 10px;
    color: #A18D7B;
    min-height: 15px;
    letter-spacing: 1px;
}

/* 歌曲清單 */

.library-section {
    margin-top: 35px;
}

.library-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.library-heading h2 {
    font-size: 17px;
    font-weight: 500;
    margin: 0;
}

.song-count {
    font-size: 11px;
    color: #A18D7B;
}

.search-box {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 1px solid #E5DED6;
    border-radius: 9px;
    outline: none;
    background: #FFFDF9;
    color: #806B5A;
    font-size: 12px;
}

.search-box:focus {
    border-color: #B58D86;
}

.song-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.song-item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 10px;
    border: 1px solid #E5DED6;
    border-radius: 10px;
    background: #FFFDF9;
    text-align: left;
    transition: background 0.2s;
    cursor: pointer;
}

.song-item:hover,
.song-item.playing {
    background: #F3E8E1;
}

.song-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    background: #E5DED6;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-info strong {
    display: block;
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-info span {
    display: block;
    font-size: 10px;
    color: #A18D7B;
    margin-top: 5px;
}

.song-status {
    font-size: 13px;
    color: #B58D86;
    padding: 0 8px;
}

.empty-message {
    text-align: center;
    font-size: 12px;
    color: #A18D7B;
    padding: 25px 0;
}

footer {
    text-align: center;
    font-size: 10px;
    color: #B5A395;
    letter-spacing: 1px;
    margin-top: 40px;
}

@media (max-width: 480px) {
    .player-card {
        padding: 22px 16px;
    }

    .player-controls {
        gap: 18px;
    }

    .page-heading h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<!-- 導覽列 -->

<header class="site-header">
    <button class="nav-button" id="menu-toggle"
        aria-label="開啟選單" aria-expanded="false" type="button">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 7H20M4 12H20M4 17H20"
                stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
        </svg>
    </button>

    <div class="nav-title">♡ Wen &amp; Yuuka ♡</div>

    <button class="language-button" id="language-toggle"
        aria-label="切換語言" aria-expanded="false" type="button">
        <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9"
                stroke="currentColor" stroke-width="1.5" />
            <path d="M3 12H21M12 3C14.5 5.5 15.5 8.5 15.5 12S14.5 18.5 12 21M12 3C9.5 5.5 8.5 8.5 8.5 12S9.5 18.5 12 21"
                stroke="currentColor" stroke-width="1.3" />
        </svg>
    </button>
</header>

<div class="language-menu" id="language-menu" hidden>
    <button class="language-option active" data-lang="ja" type="button">
        <span>日本語</span>
        <span class="language-check"></span>
    </button>
    <button class="language-option" data-lang="zh" type="button">
        <span>繁體中文</span>
        <span class="language-check"></span>
    </button>
</div>

<div class="menu-overlay" id="menu-overlay"></div>

<nav class="side-menu" id="side-menu" aria-hidden="true">
    <button class="menu-close" id="menu-close"
        aria-label="關閉選單" type="button">×</button>
    <div class="menu-heading">♡ Wen &amp; Yuuka ♡</div>
    <div class="menu-label">MENU</div>
    <div class="menu-links" id="menu-links">
        <!-- 保留原本的選單位置 -->
    </div>
</nav>

<main class="container">

    <section class="page-heading">
        <h1>Music Library</h1>
        <p>♡ Songs that remind us of each other ♡</p>
    </section>

    <!-- 音樂播放器 -->

    <section class="player-card">

        <div class="now-playing">♡ NOW PLAYING ♡</div>

        <img class="album-cover" id="album-cover"
            src="images/music-covers/odori-ko.jpg"
            alt="Album cover">

        <h2 class="track-title" id="track-title">踊り子</h2>
        <p class="track-artist" id="track-artist">Vaundy</p>

        <audio id="audio-player" preload="metadata"></audio>

        <div class="progress-area">
            <span id="current-time">0:00</span>
            <input type="range" id="progress" min="0" max="100"
                value="0" aria-label="播放進度">
            <span id="duration">0:00</span>
        </div>

        <div class="player-controls">

            <button class="control-button" id="shuffle-button"
                type="button" aria-label="隨機播放">⤨</button>

            <button class="control-button" id="previous-button"
                type="button" aria-label="上一首">⏮</button>

            <button class="play-button" id="play-button"
                type="button" aria-label="播放">▶</button>

            <button class="control-button" id="next-button"
                type="button" aria-label="下一首">⏭</button>

            <button class="control-button" id="repeat-button"
                type="button" aria-label="循環播放">↻</button>

        </div>

        <div class="mode-label" id="mode-label">REPEAT OFF</div>

        <div class="volume-area">
            <span>♪</span>
            <input type="range" id="volume"
                min="0" max="1" step="0.01" value="0.7"
                aria-label="音量">
        </div>

    </section>

    <!-- 歌曲清單 -->

    <section class="library-section">

        <div class="library-heading">
            <h2>♡ All Songs</h2>
            <span class="song-count" id="song-count">0 SONGS</span>
        </div>

        <input
            type="search"
            class="search-box"
            id="search-input"
            placeholder="Search songs or artists..."
            aria-label="搜尋歌曲或歌手">

        <div class="song-list" id="song-list"></div>

    </section>

    <footer>
        MADE WITH LOVE ♡ WEN &amp; YUUKA
    </footer>

</main>

<!-- 共用歌曲資料 -->

<script src="js/songs.js"></script>

<script>
/* 導覽列功能 */

const menuToggle = document.getElementById("menu-toggle");
const menuClose = document.getElementById("menu-close");
const menuOverlay = document.getElementById("menu-overlay");
const sideMenu = document.getElementById("side-menu");

function openMenu() {
    sideMenu.classList.add("active");
    menuOverlay.classList.add("active");
    sideMenu.setAttribute("aria-hidden", "false");
    menuToggle.setAttribute("aria-expanded", "true");
}

function closeMenu() {
    sideMenu.classList.remove("active");
    menuOverlay.classList.remove("active");
    sideMenu.setAttribute("aria-hidden", "true");
    menuToggle.setAttribute("aria-expanded", "false");
}

menuToggle.addEventListener("click", openMenu);
menuClose.addEventListener("click", closeMenu);
menuOverlay.addEventListener("click", closeMenu);

const languageToggle = document.getElementById("language-toggle");
const languageMenu = document.getElementById("language-menu");
const languageOptions = document.querySelectorAll(".language-option");

languageToggle.addEventListener("click", () => {
    languageMenu.hidden = !languageMenu.hidden;
    languageToggle.setAttribute(
        "aria-expanded",
        String(!languageMenu.hidden)
    );
});

languageOptions.forEach(option => {
    option.addEventListener("click", () => {
        languageOptions.forEach(item => item.classList.remove("active"));
        option.classList.add("active");
        languageMenu.hidden = true;
        languageToggle.setAttribute("aria-expanded", "false");
    });
});

document.addEventListener("click", event => {
    if (
        !languageMenu.contains(event.target) &&
        !languageToggle.contains(event.target)
    ) {
        languageMenu.hidden = true;
        languageToggle.setAttribute("aria-expanded", "false");
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeMenu();
        languageMenu.hidden = true;
    }
});

/* 音樂播放器 */

const audio = document.getElementById("audio-player");
const cover = document.getElementById("album-cover");
const title = document.getElementById("track-title");
const artist = document.getElementById("track-artist");
const playButton = document.getElementById("play-button");
const previousButton = document.getElementById("previous-button");
const nextButton = document.getElementById("next-button");
const shuffleButton = document.getElementById("shuffle-button");
const repeatButton = document.getElementById("repeat-button");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("current-time");
const durationText = document.getElementById("duration");
const volume = document.getElementById("volume");
const modeLabel = document.getElementById("mode-label");
const songList = document.getElementById("song-list");
const songCount = document.getElementById("song-count");
const searchInput = document.getElementById("search-input");

let currentIndex = 0;
let isShuffle = false;
let repeatMode = 0;
// 0 = 關閉，1 = 全部循環，2 = 單曲循環

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return minutes + ":" + String(remainingSeconds).padStart(2, "0");
}

function loadTrack(index) {
    if (!Array.isArray(tracks) || tracks.length === 0) {
        title.textContent = "No songs available";
        artist.textContent = "";
        return;
    }

    currentIndex = (index + tracks.length) % tracks.length;

    const track = tracks[currentIndex];

    audio.src = track.src;
    cover.src = track.cover;
    cover.alt = track.title + " album cover";
    title.textContent = track.title;
    artist.textContent = track.artist;

    progress.value = 0;
    currentTimeText.textContent = "0:00";
    durationText.textContent = "0:00";

    renderSongList();
}

function playTrack() {
    audio.play().catch(() => {
        playButton.textContent = "▶";
    });
}

function togglePlay() {
    if (audio.paused) {
        playTrack();
    } else {
        audio.pause();
    }
}

function updatePlayButton() {
    playButton.textContent = audio.paused ? "▶" : "Ⅱ";
    playButton.setAttribute(
        "aria-label",
        audio.paused ? "播放" : "暫停"
    );
}

function nextTrack() {
    let nextIndex;

    if (isShuffle && tracks.length > 1) {
        do {
            nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentIndex);
    } else {
        nextIndex = currentIndex + 1;
    }

    loadTrack(nextIndex);
    playTrack();
}

function previousTrack() {
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }

    loadTrack(currentIndex - 1);
    playTrack();
}

function renderSongList(keyword = "") {
    songList.innerHTML = "";

    const filteredTracks = tracks
        .map((track, index) => ({ track, index }))
        .filter(item => {
            const searchText = (
                item.track.title + " " + item.track.artist
            ).toLowerCase();

            return searchText.includes(keyword.toLowerCase());
        });

    songCount.textContent = filteredTracks.length + " SONGS";

    if (filteredTracks.length === 0) {
        songList.innerHTML =
            '<div class="empty-message">No songs found ♡</div>';
        return;
    }

    filteredTracks.forEach(({ track, index }) => {
        const item = document.createElement("div");
        item.className = "song-item";

        if (index === currentIndex) {
            item.classList.add("playing");
        }

        const image = document.createElement("img");
        image.src = track.cover;
        image.alt = "";

        const info = document.createElement("div");
        info.className = "song-info";

        const songTitle = document.createElement("strong");
        songTitle.textContent = track.title;

        const songArtist = document.createElement("span");
        songArtist.textContent = track.artist;

        info.appendChild(songTitle);
        info.appendChild(songArtist);

        const status = document.createElement("span");
        status.className = "song-status";
        status.textContent =
            index === currentIndex ? "♫" : "♡";

        item.appendChild(image);
        item.appendChild(info);
        item.appendChild(status);

        item.addEventListener("click", () => {
            loadTrack(index);
            playTrack();
        });

        songList.appendChild(item);
    });
}

/* 播放控制 */

playButton.addEventListener("click", togglePlay);
previousButton.addEventListener("click", previousTrack);
nextButton.addEventListener("click", nextTrack);

audio.addEventListener("play", () => {
    updatePlayButton();
    renderSongList(searchInput.value);
});

audio.addEventListener("pause", () => {
    updatePlayButton();
    renderSongList(searchInput.value);
});

audio.addEventListener("ended", () => {
    if (repeatMode === 2) {
        audio.currentTime = 0;
        playTrack();
    } else if (repeatMode === 1 || isShuffle) {
        nextTrack();
    } else if (currentIndex < tracks.length - 1) {
        nextTrack();
    } else {
        audio.currentTime = 0;
        updatePlayButton();
    }
});

/* 進度條 */

audio.addEventListener("loadedmetadata", () => {
    durationText.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    if (!Number.isFinite(audio.duration) || audio.duration === 0) {
        return;
    }

    progress.value = (audio.currentTime / audio.duration) * 100;
    currentTimeText.textContent = formatTime(audio.currentTime);
});

progress.addEventListener("input", () => {
    if (Number.isFinite(audio.duration)) {
        audio.currentTime = (progress.value / 100) * audio.duration;
    }
});

/* 音量 */

audio.volume = 0.7;

volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
});

/* 隨機播放 */

shuffleButton.addEventListener("click", () => {
    isShuffle = !isShuffle;
    shuffleButton.classList.toggle("active", isShuffle);

    modeLabel.textContent = isShuffle
        ? "SHUFFLE ON"
        : repeatMode === 0
            ? "REPEAT OFF"
            : repeatMode === 1
                ? "REPEAT ALL"
                : "REPEAT ONE";
});

/* 循環模式 */

repeatButton.addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;

    repeatButton.classList.toggle("active", repeatMode !== 0);

    const labels = [
        "REPEAT OFF",
        "REPEAT ALL",
        "REPEAT ONE"
    ];

    modeLabel.textContent = labels[repeatMode];
});

/* 搜尋歌曲 */

searchInput.addEventListener("input", () => {
    renderSongList(searchInput.value);
});

/* 初始設定 */

if (Array.isArray(tracks) && tracks.length > 0) {
    audio.volume = 0.7;
    loadTrack(0);
} else {
    title.textContent = "No songs available";
    songList.innerHTML =
        '<div class="empty-message">Please check js/songs.js</div>';
}
</script>

</body>
</html>
