<style>
:root {
    --bg: #FBF8F3;
    --text: #806B5A;
    --muted: #A18D7B;
    --card: #F3E8E1;
    --border: #E5DED6;
    --accent: #B58D86;
    --nav: #806B5A;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding-top: 66px;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif JP", serif;
}

/* Navigation */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 66px;
    background: var(--nav);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    z-index: 1000;
}

.nav-side {
    width: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-title {
    color: #FBF8F3;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-decoration: none;
    text-align: center;
}

.nav-button {
    width: 38px;
    height: 38px;
    padding: 0;
    border: none;
    background: transparent;
    color: #FBF8F3;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-button svg {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Language menu */

.language-wrapper {
    position: relative;
}

.language-dropdown {
    display: none;
    position: absolute;
    top: 47px;
    right: 0;
    width: 145px;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 5px 18px rgba(80, 60, 40, 0.12);
}

.language-dropdown.show {
    display: block;
}

.language-option {
    width: 100%;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
}

.language-option:hover {
    background: var(--card);
    border-radius: 5px;
}

.language-check {
    visibility: hidden;
}

.language-option.active .language-check {
    visibility: visible;
}

/* Side menu */

.menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40, 30, 25, 0.35);
    z-index: 1100;
}

.menu-overlay.show {
    display: block;
}

.side-menu {
    position: absolute;
    top: 0;
    left: 0;
    width: 280px;
    max-width: 82%;
    height: 100%;
    padding: 25px 22px;
    background: var(--bg);
    box-shadow: 5px 0 20px rgba(0, 0, 0, 0.08);
}

.menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
}

.menu-heading {
    font-size: 15px;
    letter-spacing: 1px;
}

.menu-close {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 25px;
    cursor: pointer;
}

#menu-links {
    padding-top: 20px;
}

/* Main layout */

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 42px 22px 70px;
}

.page-heading {
    text-align: center;
    margin-bottom: 32px;
}

.page-heading h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 2px;
}

.page-heading p {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
}

/* Player */

.player-card {
    padding: 27px 24px 25px;
    background: #FFFDF9;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
}

.now-playing {
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 3px;
}

.album-cover {
    width: 210px;
    height: 210px;
    max-width: 70%;
    object-fit: cover;
    border-radius: 5px;
    box-shadow: 0 5px 18px rgba(80, 60, 40, 0.12);
}

.song-title {
    margin: 22px 0 5px;
    font-size: 20px;
    font-weight: 500;
}

.song-artist {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

.progress-area {
    margin-top: 24px;
}

.progress-bar {
    width: 100%;
    height: 4px;
    appearance: none;
    background: var(--border);
    border-radius: 5px;
    cursor: pointer;
}

.progress-bar::-webkit-slider-thumb {
    appearance: none;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
}

.progress-bar::-moz-range-thumb {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
}

.time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: var(--muted);
    font-size: 10px;
}

/* Player controls */

.player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    margin-top: 20px;
}

.control-button {
    position: relative;
    width: 34px;
    height: 34px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.2s ease;
}

.control-button svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Shuffle and Repeat */

.side-control {
    width: 26px;
    height: 34px;
    color: var(--muted);
}

.side-control svg {
    width: 17px;
    height: 17px;
}

.side-control.active {
    color: var(--text);
}

.side-control:hover {
    color: var(--accent);
}

/* Repeat single */

.repeat-one {
    display: none;
    position: absolute;
    right: 0;
    bottom: 2px;
    font-family: sans-serif;
    font-size: 8px;
    font-weight: bold;
}

#repeat-button.repeat-single .repeat-one {
    display: block;
}

#previous-button,
#next-button {

    height: 34px;

    border-radius: 50%;

    align-items: center;
    justify-content: center;
    padding: 0;
}

#previous-button svg,
#next-button svg {

    height: 16px;
    fill: #806B5A;
    stroke: none;
}

#play-button {

    height: 46px;
    border-radius: 50%;
    background: var(--text);
    color: white;
}

#play-button svg {
    width: 19px;
    height: 19px;
    fill: currentColor;
    stroke: none;
}

.control-button.active {
    color: var(--accent);
}

.playback-options {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
}

.playback-icon-button {

    height: 40px;

    justify-content: center;

.playback-icon-button svg {

    stroke-width: 1.6;

.playback-icon-button:hover {

}

.playback-icon-button.active {

#repeat-button.repeat-single .repeat-one {

.volume-area {

    margin-top: 19px;
    color: var(--muted);
}

.volume-area svg {
    width: 16px;

    stroke: currentColor;
    stroke-width: 1.5;
}

.volume-bar {
    width: 100px;

/* Song collection */

.collection {

.section-heading {
    margin-bottom: 20px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1.5px;

.section-heading span {

.filter-area {

.filter-group label {
    display: block;
    margin-bottom: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
}

<script>
/* Navigation */

const menuButton = document.getElementById("menu-button");
const menuOverlay = document.getElementById("menu-overlay");
const menuClose = document.getElementById("menu-close");

menuButton.addEventListener("click", () => {
    menuOverlay.classList.add("show");
});

menuClose.addEventListener("click", () => {
    menuOverlay.classList.remove("show");
});

menuOverlay.addEventListener("click", (event) => {
    if (event.target === menuOverlay) {
        menuOverlay.classList.remove("show");
    }
});

/* Language dropdown */

const languageButton = document.getElementById("language-button");
const languageDropdown = document.getElementById("language-dropdown");

languageButton.addEventListener("click", (event) => {
    event.stopPropagation();
    languageDropdown.classList.toggle("show");
});

document.querySelectorAll(".language-option").forEach(option => {
    option.addEventListener("click", () => {
        document.querySelectorAll(".language-option").forEach(item => {
            item.classList.remove("active");
        });

        option.classList.add("active");
        languageDropdown.classList.remove("show");
    });
});

document.addEventListener("click", (event) => {
    if (!event.target.closest(".language-wrapper")) {
        languageDropdown.classList.remove("show");
    }
});

/* Music data */

const songData = Array.isArray(tracks) ? tracks : [];

const audio = document.getElementById("audio-player");
const albumCover = document.getElementById("album-cover");
const currentTitle = document.getElementById("current-title");
const currentArtist = document.getElementById("current-artist");

const playButton = document.getElementById("play-button");
const playIcon = document.getElementById("play-icon");
const previousButton = document.getElementById("previous-button");
const nextButton = document.getElementById("next-button");

const progressBar = document.getElementById("progress-bar");
const currentTime = document.getElementById("current-time");
const duration = document.getElementById("duration");
const volumeBar = document.getElementById("volume-bar");

const repeatButton = document.getElementById("repeat-button");
const shuffleButton = document.getElementById("shuffle-button");

const searchInput = document.getElementById("search-input");
const typeFilter = document.getElementById("type-filter");
const languageFilter = document.getElementById("language-filter");
const songList = document.getElementById("song-list");

let currentIndex = 0;
let repeatMode = 0;
let shuffleEnabled = false;

const repeatLabels = [
    "リピートなし",
    "全曲リピート",
    "1曲リピート"
];

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}

/* Load a song */

function loadSong(index) {
    if (!songData.length) return;

    currentIndex = (index + songData.length) % songData.length;

    const song = songData[currentIndex];

    audio.src = song.src;
    albumCover.src = song.cover;
    currentTitle.textContent = song.title;
    currentArtist.textContent = song.artist;

    progressBar.value = 0;
    currentTime.textContent = "0:00";
    duration.textContent = "0:00";

    renderSongList();
}

/* Play / Pause */

function updatePlayIcon(isPlaying) {
    if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 4H10V20H6ZM14 4H18V20H14Z"/>';
    } else {
        playIcon.innerHTML = '<path d="M7 4V20L20 12Z"/>';
    }
}

function playSong() {
    if (!songData.length) return;

    audio.play().catch(() => {
        updatePlayIcon(false);
    });
}

function togglePlay() {
    if (audio.paused) {
        playSong();
    } else {
        audio.pause();
    }
}

playButton.addEventListener("click", togglePlay);

audio.addEventListener("play", () => {
    updatePlayIcon(true);
    renderSongList();
});

audio.addEventListener("pause", () => {
    updatePlayIcon(false);
    renderSongList();
});

/* Previous / Next */

function nextSong() {
    if (!songData.length) return;

    if (shuffleEnabled && songData.length > 1) {
        let nextIndex;

        do {
            nextIndex = Math.floor(Math.random() * songData.length);
        } while (nextIndex === currentIndex);

        loadSong(nextIndex);
    } else {
        loadSong(currentIndex + 1);
    }

    playSong();
}

function previousSong() {
    if (!songData.length) return;

    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }

    loadSong(currentIndex - 1);
    playSong();
}

previousButton.addEventListener("click", previousSong);
nextButton.addEventListener("click", nextSong);

/* Repeat */

repeatButton.addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;

    repeatButton.classList.toggle("active", repeatMode !== 0);
    repeatButton.classList.toggle("repeat-single", repeatMode === 2);

    const labels = [
        "リピートなし",
        "全曲リピート",
        "1曲リピート"
    ];

    repeatButton.setAttribute("aria-label", labels[repeatMode]);
    repeatButton.setAttribute("title", labels[repeatMode]);
});

audio.addEventListener("ended", () => {
    if (repeatMode === 2) {
        audio.currentTime = 0;
        playSong();
    } else if (repeatMode === 1) {
        nextSong();
    } else if (shuffleEnabled || currentIndex < songData.length - 1) {
        nextSong();
    } else {
        updatePlayIcon(false);
    }
});

/* Shuffle */

shuffleButton.addEventListener("click", () => {
    shuffleEnabled = !shuffleEnabled;
    shuffleButton.classList.toggle("active", shuffleEnabled);
});

/* Progress */

audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

    progressBar.value = (audio.currentTime / audio.duration) * 100;
    currentTime.textContent = formatTime(audio.currentTime);
});

progressBar.addEventListener("input", () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

    audio.currentTime = (progressBar.value / 100) * audio.duration;
});

/* Volume */

audio.volume = 0.7;

volumeBar.addEventListener("input", () => {
    audio.volume = Number(volumeBar.value);
});


/* Song list and filters */

let selectedType = "all";
let selectedLanguage = "all";

function setupFilterButtons(containerId, onSelect) {
    const container = document.getElementById(containerId);
    const buttons = container.querySelectorAll(".filter-button");

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            buttons.forEach(item => item.classList.remove("active"));

            button.classList.add("active");

            onSelect(button.dataset.value);
            renderSongList();
        });
    });
}

setupFilterButtons("type-filter", value => {
    selectedType = value;
});

setupFilterButtons("language-filter", value => {
    selectedLanguage = value;
});

function renderSongList() {
    songList.innerHTML = "";

    const keyword = searchInput.value.trim().toLowerCase();

    const filteredSongs = songData
        .map((song, index) => ({ ...song, originalIndex: index }))
        .filter(song => {
            const matchesKeyword =
                song.title.toLowerCase().includes(keyword) ||
                song.artist.toLowerCase().includes(keyword);

            const matchesType =
                selectedType === "all" || song.type === selectedType;

            const matchesLanguage =
                selectedLanguage === "all" ||
                song.language === selectedLanguage;

            return matchesKeyword && matchesType && matchesLanguage;
        });

    if (!filteredSongs.length) {
        songList.innerHTML =
            '<div class="empty-message">該当する曲がありません。</div>';
        return;
    }

    filteredSongs.forEach(song => {
        const item = document.createElement("div");

        item.className = "song-item";

        if (song.originalIndex === currentIndex) {
            item.classList.add("playing");
        }

        const image = document.createElement("img");
        image.src = song.cover;
        image.alt = song.title;

        const info = document.createElement("div");
        info.className = "song-info";

        const title = document.createElement("h3");
        title.textContent = song.title;

        const artist = document.createElement("p");
        artist.textContent = song.artist;

        info.appendChild(title);
        info.appendChild(artist);

        const status = document.createElement("span");
        status.className = "song-status";

        status.textContent =
            song.originalIndex === currentIndex && !audio.paused ? "♫" : "♡";

        item.appendChild(image);
        item.appendChild(info);
        item.appendChild(status);

        item.addEventListener("click", () => {
            loadSong(song.originalIndex);
            playSong();
        });

        songList.appendChild(item);
    });
}

searchInput.addEventListener("input", renderSongList);

/* Initial setup */

if (songData.length > 0) {
    loadSong(0);
    audio.volume = 0.7;
} else {
    songList.innerHTML =
        '<div class="empty-message">曲がまだ登録されていません。</div>';
}
</script>

</body>
</html>
